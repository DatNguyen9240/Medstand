<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Test Full Chatbot (Thiết bị di động)</title>

    <!-- Global CSS -->
    <link rel="stylesheet" href="../src/css/design-tokens.css">
    <link rel="stylesheet" href="../src/css/global.css">
    
    <!-- Chatbot CSS -->
    <link rel="stylesheet" href="../chatbot-widget/css/chatbot.css">
    <link rel="stylesheet" href="../chatbot-widget/css/chatbot-api-engine.css">

    <style>
        body, html { margin: 0; padding: 0; height: 100%; box-sizing: border-box; background: #f0f2f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: flex-start; }
        
        .layout-wrapper { display: flex; gap: 40px; margin-top: 40px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 1200px; }

        /* Box frame giả lập App Mobile */
        .mock-phone { 
            width: 400px; height: 800px; 
            border: 12px solid #2c3e50; 
            border-radius: 40px; 
            overflow: hidden; 
            position: relative; 
            background: #fff;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            display: flex; flex-direction: column; flex-shrink: 0;
        }

        .phone-notch {
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 150px; height: 25px; background: #2c3e50;
            border-bottom-left-radius: 15px; border-bottom-right-radius: 15px; z-index: 9999;
        }

        .chat-container { flex: 1; overflow-y: auto; position: relative; background: #fff; padding-top: 30px; }

        /* Khung test tự động */
        .auto-test-panel {
            width: 450px; background: white; padding: 25px; border-radius: 16px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #ddd;
            display: flex; flex-direction: column; gap: 15px; flex-shrink: 0;
        }
        
        .auto-test-panel h2 { margin: 0; display: flex; align-items: center; justify-content: space-between;}
        .test-btn { background: #0056b3; color: #fff; border: none; padding: 12px 20px; font-weight: bold; font-size: 16px; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .test-btn:hover { background: #004085; }
        .test-btn:disabled { background: #ccc; cursor: not-allowed; }

        .test-log { list-style: none; padding: 0; margin: 0; overflow-y: auto; height: 600px; }
        .test-item { margin-bottom: 10px; padding: 12px; border-radius: 6px; background: #f8f9fa; border-left: 4px solid #ccc; font-size: 14px; position: relative;}
        .test-item.running { border-left-color: #f39c12; background: #fffdf0; }
        .test-item.pass { border-left-color: #27ae60; background: #f0fdf4; }
        .test-item.fail { border-left-color: #e74c3c; background: #fdf0f0; }

        .status-badge { float: right; font-weight: bold; font-size: 12px; }
        .running .status-badge { color: #f39c12; }
        .pass .status-badge { color: #27ae60; }
        .fail .status-badge { color: #e74c3c; }

        @media(max-width: 900px) {
            .layout-wrapper { flex-direction: column; align-items: center; }
            .mock-phone { height: 600px; width: 350px; }
            .auto-test-panel { width: 350px; }
        }
    </style>
</head>
<body>

<div class="layout-wrapper">
    <!-- KHUNG ĐIỆN THOẠI -->
    <div class="mock-phone">
        <div class="phone-notch"></div>
        
        <header class="app-header" style="display: none;">
            <button type="button" class="header-icon" id="btn-back"></button>
            <div class="header-info"></div>
            <button type="button" class="header-icon" id="btn-clear-chat"></button>
        </header>

        <div class="chat-container" id="chat-container">
            <div class="chat-welcome" id="chat-welcome" style="display: none;">
                <div class="chat-welcome-icon">🤖</div>
                <h2 class="chat-welcome-title">Xin chào!</h2>
                <p class="chat-welcome-text">Tôi là trợ lý AI của bạn. Hãy hỏi tôi bất cứ điều gì!</p>
                <div class="chat-suggestions">
                    <button class="chat-chip" type="button" onclick="document.getElementById('chat-input').value='Doanh số tháng này'; document.getElementById('chat-input').dispatchEvent(new Event('input', {bubbles:true})); document.getElementById('btn-send').disabled=false;">📊 Doanh số tháng này</button>
                    <button class="chat-chip" type="button" onclick="document.getElementById('chat-input').value='Top khách hàng'; document.getElementById('chat-input').dispatchEvent(new Event('input', {bubbles:true})); document.getElementById('btn-send').disabled=false;">👥 Top khách hàng</button>
                    <button class="chat-chip" type="button" onclick="document.getElementById('chat-input').value='Đơn chờ duyệt'; document.getElementById('chat-input').dispatchEvent(new Event('input', {bubbles:true})); document.getElementById('btn-send').disabled=false;">📦 Đơn chờ duyệt</button>
                    <button class="chat-chip" type="button" onclick="document.getElementById('chat-input').value='SP bán chạy'; document.getElementById('chat-input').dispatchEvent(new Event('input', {bubbles:true})); document.getElementById('btn-send').disabled=false;">🔥 SP bán chạy</button>
                </div>
            </div>
            <div class="chat-messages" id="chat-messages"></div>
        </div>

        <div class="chat-input-bar" id="chat-input-bar">
            <div class="chat-file-list-wrap" id="chat-file-preview" style="display:none">
                <div class="chat-file-list" id="chat-file-list"></div>
            </div>

            <input type="file" id="chat-file-input" hidden multiple>
            <div class="chat-input-wrap">
                <button type="button" class="chat-action-btn chat-attach-btn" id="btn-attach">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                </button>
                <button type="button" class="chat-action-btn chat-api-btn" id="btn-api">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><circle cx="17.5" cy="17.5" r="3.5"></circle></svg>
                </button>

                <textarea class="chat-input" id="chat-input" placeholder="Nhập tin nhắn..." rows="1" autocomplete="off" spellcheck="false"></textarea>

                <button type="button" class="chat-send-btn" id="btn-send" disabled>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- KHUNG ĐIỀU KHIỂN AUTOMATION -->
    <div class="auto-test-panel">
        <h2>🤖 Auto Test Runner 
            <button id="btn-run-tests" class="test-btn" onclick="startAutoTest()">▶ Chạy Tự Động</button>
        </h2>
        <p style="color:gray; font-size:14px; margin-top:0;">Bot nén phím ảo để tự động kiểm tra xem AI/n8n có phản hồi chính xác hay không và ghi log lại.</p>
        <ul class="test-log" id="test-log">
            <!-- Test log item insert qua JS -->
        </ul>
    </div>
</div>

<script src="../env.js"></script>
<script>function _cbGetToken() { return localStorage.getItem('auth_token') || 'TEST_TOKEN'; }</script>

<script src="../chatbot-widget/js/chatbot-api-engine.js"></script>
<script src="../chatbot-widget/js/chatbot.js"></script>
<script src="../chatbot-widget/js/chatbot-suggestions.js"></script>
<script src="../chatbot-widget/js/chatbot-renderers-medstand.js"></script>

<!-- AUTOMATION SCRIPT -->
<script>
    const TEST_SCENARIOS = [
        {
            name: "Test 1: Mở menu chức năng (@)",
            action: async () => {
                let input = document.getElementById('chat-input');
                input.value = "@";
                input.dispatchEvent(new Event('input', { bubbles: true }));
                
                await new Promise(r => setTimeout(r, 600)); // Đợi menu xổ lên
                let menu = document.getElementById('ae-menu');
                if (!menu || menu.style.display === 'none') throw new Error("Không thấy gợi ý menu API mở lên.");
                return "Menu gợi ý đã mở thành công.";
            }
        },
        {
            name: "Test 2: Gửi câu lệnh thường (Ping AI)",
            action: async () => {
                // Xóa input cũ
                let input = document.getElementById('chat-input');
                input.value = "Xin chào, mình đang test tự động";
                input.dispatchEvent(new Event('input', { bubbles: true }));
                
                // Mở sẵn số lượng tin nhắn trước khi gửi
                let msgDivs = document.querySelectorAll('.chat-bubble').length;

                // Gửi
                document.getElementById('btn-send').disabled = false;
                document.getElementById('btn-send').click();

                // Chờ AI phản hồi (Tối đa 15s)
                return new Promise((resolve, reject) => {
                    let maxWait = 15000;
                    let checkInterval = setInterval(() => {
                        maxWait -= 500;
                        let newDivs = document.querySelectorAll('.chat-bubble.ai');
                        // Nếu có phản hồi mới từ AI
                        if (document.querySelectorAll('.chat-bubble').length > msgDivs + 1) { 
                            clearInterval(checkInterval);
                            resolve("AI đã phản hồi tin nhắn văn bản.");
                        }
                        if (maxWait <= 0) {
                            clearInterval(checkInterval);
                            reject(new Error("Timeout: n8n không trả lời sau 15s"));
                        }
                    }, 500);
                });
            }
        },
        {
            name: "Test 3: Click thử nút Clear Lịch Sử",
            action: async () => {
                await new Promise(r => setTimeout(r, 1000));
                let clearBtn = document.getElementById('btn-clear-chat');
                if(clearBtn) {
                    clearBtn.click();
                    let msgCount = document.querySelectorAll('.chat-bubble').length;
                    if(msgCount > 0) throw new Error("Xóa lịch sử không thành công.");
                    return "Lịch sử đã được xóa sạch sẽ.";
                }
                throw new Error("Không tìm thấy nút xóa lịch sử.");
            }
        }
    ];

    function createLogItem(id, text) {
        let ul = document.getElementById('test-log');
        let li = document.createElement('li');
        li.className = 'test-item';
        li.id = 'log-' + id;
        li.innerHTML = `<span>${text}</span> <span class="status-badge">Đứng chờ...</span>`;
        ul.appendChild(li);
        return li;
    }

    async function startAutoTest() {
        let btn = document.getElementById('btn-run-tests');
        btn.disabled = true;
        btn.innerText = "⏳ Đang chạy...";
        document.getElementById('test-log').innerHTML = ''; // reset log

        for(let i=0; i<TEST_SCENARIOS.length; i++) {
            let scen = TEST_SCENARIOS[i];
            let el = createLogItem(i, scen.name);
            el.classList.add('running');
            el.querySelector('.status-badge').innerText = 'Đang chạy...';

            // Wait a sec before acting to see visually
            await new Promise(r => setTimeout(r, 800));

            try {
                let result = await scen.action();
                el.classList.remove('running');
                el.classList.add('pass');
                el.querySelector('.status-badge').innerText = '✅ PASS';
                el.innerHTML += `<br><small style="color:gray">↳ ${result}</small>`;
            } catch(e) {
                el.classList.remove('running');
                el.classList.add('fail');
                el.querySelector('.status-badge').innerText = '❌ FAIL';
                el.innerHTML += `<br><small style="color:red">↳ ${e.message}</small>`;
                break; // Stop running next tests if one fails
            }
        }

        btn.innerText = "▶ Chạy lại Tự Động";
        btn.disabled = false;
    }
</script>

</body>
</html>
