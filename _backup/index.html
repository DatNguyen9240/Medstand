<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="src/pwa/manifest.json">
    <meta name="theme-color" content="#3c50e0">
    <link rel="apple-touch-icon" href="images/logo/medstand-logo.png">
    <title>Trang chủ - Medstand</title>
    <link rel="stylesheet" href="src/css/design-tokens.css">
    <link rel="stylesheet" href="src/css/global.css">
    <link rel="stylesheet" href="src/css/components/header.css">
    <link rel="stylesheet" href="src/css/components/card.css">
    <link rel="stylesheet" href="src/css/components/nav-bar.css">
    <link rel="stylesheet" href="src/css/components/list.css">
    <link rel="stylesheet" href="src/css/components/chart.css">
    <link rel="stylesheet" href="src/css/components/skeleton.css">
    <link rel="stylesheet" href="src/css/components/loading-spinner.css">
    <link rel="stylesheet" href="src/css/layouts/desktop.css">
    <script src="src/js/utils/theme.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cash/8.1.5/cash.min.js"></script>

</head>

<body data-page="home">
    <div id="global-spinner" class="loading-spinner" hidden aria-live="polite">
        <span class="spinner-dot"></span>
    </div>

    <header class="app-header">
        <img src="https://ui-avatars.com/api/?name=User&background=3c50e0&color=fff" alt="" class="header-avatar"
            width="40" height="40">
        <div class="header-info">
            <p class="header-greeting">Xin chào</p>
            <p class="header-username">Tài khoản test app</p>
        </div>
        <div class="header-actions">
            <span id="theme-toggle-container"></span>
            <div class="header-notification">
                <button type="button" class="header-icon" aria-label="Thông báo" id="btn-notif">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
                        <path d="M13.73 21a2 2 0 0 1-3.46 0" />
                    </svg>
                    <span class="notification-badge" id="notif-badge" hidden>0</span>
                </button>
                <div class="notification-dropdown" id="notif-dropdown">
                    <div class="notif-header">
                        <strong>Thông báo</strong>
                        <button type="button" class="notif-mark-read" id="btn-mark-read">Đọc tất cả</button>
                    </div>
                    <ul class="notif-list" id="notif-list">
                        <li class="notif-item" style="text-align:center;color:var(--color-text-muted);padding:16px;">
                            Đang tải thông báo...
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </header>

    <main class="app-main">
        <div class="app-content">
            <div class="top-row">
                <div id="stats-container">
                    <div class="stats-row" id="stats-skeleton" aria-busy="true">
                        <div class="stat-card skeleton">
                            <div class="skeleton-text"></div>
                            <div class="skeleton-text" style="width:50%"></div>
                        </div>
                        <div class="stat-card skeleton">
                            <div class="skeleton-text"></div>
                            <div class="skeleton-text" style="width:50%"></div>
                        </div>
                        <div class="stat-card skeleton">
                            <div class="skeleton-text"></div>
                            <div class="skeleton-text" style="width:50%"></div>
                        </div>
                    </div>
                    <div class="stats-row" id="stats-content" hidden aria-busy="false"></div>
                </div>

                <div class="revenue-section">
                    <div class="revenue-top-row">
                        <p class="revenue-title">Doanh số tháng</p>
                        <p class="revenue-value" id="revenue-value" hidden>—</p>
                        <div class="skeleton skeleton-text" id="revenue-skeleton"
                            style="width:140px;height:28px;border-radius:6px"></div>
                    </div>
                    <div class="revenue-date-row">
                        <input type="date" id="chart-date-from" class="date-input form-control" aria-label="Từ ngày">
                        <span class="revenue-arrow">→</span>
                        <input type="date" id="chart-date-to" class="date-input form-control" aria-label="Đến ngày">
                    </div>
                </div>
            </div>

            <div class="chart-section">
                <div class="chart-header">
                    <div class="chart-header-left">
                        <h3 class="chart-title">Biểu đồ doanh số</h3>
                        <p class="chart-subtitle">Theo ngày trong kỳ</p>
                    </div>
                </div>
                <div id="chart-skeleton" class="skeleton skeleton-chart"></div>
                <div class="chart-wrapper">
                    <canvas id="revenue-chart" style="display:none"></canvas>
                </div>
            </div>

            <div class="section-header">
                <span class="section-line"></span>
                <h3 class="section-title">Sinh nhật</h3>
                <span class="section-badge" id="birthday-count" hidden>🎁 0</span>
            </div>

            <div id="birthdays-container">
                <ul class="list" id="birthdays-skeleton">
                    <li class="skeleton-list-item">
                        <div class="skeleton skeleton-avatar"></div>
                        <div class="skeleton" style="flex:1;height:2em"></div>
                    </li>
                    <li class="skeleton-list-item">
                        <div class="skeleton skeleton-avatar"></div>
                        <div class="skeleton" style="flex:1;height:2em"></div>
                    </li>
                    <li class="skeleton-list-item">
                        <div class="skeleton skeleton-avatar"></div>
                        <div class="skeleton" style="flex:1;height:2em"></div>
                    </li>
                </ul>
                <ul class="list" id="birthdays-list" hidden></ul>
            </div>
        </div>
    </main>

    <div id="sidebar-container"></div>
    <div id="nav-container"></div>

    <script src="src/js/utils/debounce.js"></script>
    <script src="src/js/components/LoadingSpinner.js"></script>
    <script src="src/js/components/NavBar.js"></script>
    <!-- API layer: config → http → services -->
    <script src="src/js/config/api.config.js"></script>
    <script src="src/js/utils/format.js"></script>
    <script src="src/js/schemas/dashboard.schema.js"></script>
    <script src="src/js/services/http.js"></script>
    <script src="src/js/services/auth.service.js"></script>
    <script src="src/js/services/dashboard.service.js"></script>
    <script src="src/js/services/order.service.js"></script>
    <script src="src/js/services/sales.service.js"></script>
    <script src="src/js/services/other.service.js"></script>
    <script src="src/js/components/SurveyCheck.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="src/js/components/Chart.js"></script>
    <script src="src/js/pages/home.js"></script>
    <script src="src/js/pages/index.js"></script>
    <script src="src/pwa/pwa-register.js"></script>
</body>

</html>
