<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="src/pwa/manifest.json">
    <meta name="theme-color" content="#3c50e0">
    <link rel="apple-touch-icon" href="images/logo/medstand-logo.png">
  <title>Chi tiết đơn hàng - Medstand</title>
  <link rel="stylesheet" href="src/css/design-tokens.css">
  <link rel="stylesheet" href="src/css/global.css">
  <link rel="stylesheet" href="src/css/components/header.css">
  <link rel="stylesheet" href="src/css/components/card.css">
  <link rel="stylesheet" href="src/css/components/nav-bar.css">
  <link rel="stylesheet" href="src/css/layouts/desktop.css">
  <style>
    .segment {
      display: flex;
      gap: 16px;
      margin-bottom: var(--spacing-md);
      border-bottom: 1px solid var(--color-border);
    }

    .segment-item {
      border: none;
      background: none;
      padding: 8px 0;
      color: var(--color-text-muted);
      cursor: pointer;
      font-family: var(--font-family);
      font-size: var(--font-size-sm);
    }

    .segment-item.active {
      color: var(--color-primary);
      font-weight: 600;
      border-bottom: 2px solid var(--color-primary);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .summary-card {
      background: var(--color-surface);
      border-radius: var(--radius-md);
      padding: var(--spacing-md);
      margin-bottom: var(--spacing-md);
      border: 1px solid var(--color-border);
    }

    .summary-card .title {
      font-weight: 600;
      margin-bottom: var(--spacing-md);
      color: var(--color-primary);
    }

    .summary-card .row {
      display: flex;
      justify-content: space-between;
      margin-bottom: var(--spacing-xs);
      font-size: var(--font-size-sm);
      color: var(--color-text);
    }

    .report-card {
      background: var(--color-surface);
      border-radius: var(--radius-md);
      padding: var(--spacing-md);
      margin-bottom: var(--spacing-md);
      border: 1px solid var(--color-border);
    }

    .report-card .row {
      display: flex;
      justify-content: space-between;
      margin-bottom: var(--spacing-xs);
      font-size: var(--font-size-sm);
      color: var(--color-text);
    }

    .report-card .amount,
    .summary-card .amount {
      color: var(--color-primary);
      font-weight: 600;
    }
  </style>
  <script src="src/js/utils/theme.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cash/8.1.5/cash.min.js"></script>
  <script src="src/js/config/api.config.js"></script>
  <script src="src/js/services/http.js"></script>
  <script src="src/js/components/SurveyCheck.js"></script>
</head>

<body>
  <header class="app-header" style="justify-content: flex-start; gap: 12px;">
    <a href="orders.html" style="text-decoration: none; color: var(--color-text-muted); font-size:1.2rem">←</a>
    <span id="page-title" style="color: var(--color-primary); font-weight: 600;">Chi tiết đơn hàng</span>
    <div style="margin-left:auto" id="theme-toggle-container"></div>
  </header>
  <div id="sidebar-container"></div>
  <main class="app-main">
    <div class="app-content">
      <div class="segment">
        <button class="segment-item active" data-tab="overview">Tổng quan</button>
        <button class="segment-item" data-tab="detail">Chi tiết SP</button>
      </div>
      <div id="tab-overview" class="tab-content active">
        <p style="text-align:center;color:var(--color-text-muted);padding:48px 0">Đang tải...</p>
      </div>
      <div id="tab-detail" class="tab-content">
        <p style="text-align:center;color:var(--color-text-muted);padding:48px 0">Đang tải...</p>
      </div>
    </div>
  </main>
  <div id="nav-container"></div>
  <script src="src/js/components/NavBar.js"></script>
  <script src="src/js/utils/format.js"></script>
    <script src="src/js/pages/order-report.js"></script>
    <script src="src/pwa/pwa-register.js"></script>
</body>

</html>
