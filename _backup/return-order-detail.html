<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="src/pwa/manifest.json">
    <meta name="theme-color" content="#3c50e0">
    <link rel="apple-touch-icon" href="images/logo/medstand-logo.png">
  <title>Chi tiết phiếu trả hàng - Medstand</title>
  <link rel="stylesheet" href="src/css/design-tokens.css">
  <link rel="stylesheet" href="src/css/global.css">
  <link rel="stylesheet" href="src/css/components/header.css">
  <link rel="stylesheet" href="src/css/components/card.css">
  <link rel="stylesheet" href="src/css/components/nav-bar.css">
  <link rel="stylesheet" href="src/css/components/skeleton.css">
  <link rel="stylesheet" href="src/css/components/search-bar.css">
  <link rel="stylesheet" href="src/css/components/total-bar.css">
  <link rel="stylesheet" href="src/css/pages/detail.css">
  <link rel="stylesheet" href="src/css/layouts/desktop.css">
  <style>
    .product-item {
      display: block;
    }

    .product-code {
      font-size: var(--font-size-xs);
      color: var(--color-text-muted);
      margin-bottom: 8px;
    }

    .search-wrap {
      position: relative;
      margin-bottom: var(--spacing-md);
    }

    .search-wrap input {
      width: 100%;
      padding: 12px 16px 12px 44px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      background: var(--color-surface);
      font-size: var(--font-size-sm);
      font-family: var(--font-family);
      color: var(--color-text);
      outline: none;
      box-sizing: border-box;
      transition: border-color var(--transition-fast);
    }

    .search-wrap input:focus {
      border-color: var(--color-primary);
    }

    .search-wrap input::placeholder {
      color: var(--color-text-muted);
    }

    .search-wrap .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--color-text-muted);
      pointer-events: none;
      display: flex;
    }

    .skeleton-summary {
      height: 80px;
    }
  </style>
  <script src="src/js/utils/theme.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cash/8.1.5/cash.min.js"></script>
  <script src="src/js/config/api.config.js"></script>
  <script src="src/js/utils/format.js"></script>
  <script src="src/js/services/http.js"></script>
  <script src="src/js/components/SurveyCheck.js"></script>
</head>

<body data-page="return-order-detail">
  <header class="app-header" style="justify-content: flex-start; gap: 12px; padding: 0 16px;">
    <a href="return-orders.html" style="text-decoration: none; color: var(--color-text-muted); font-size: 1.2rem;">←</a>
    <span style="color: var(--color-primary); font-weight: 600;">Chi tiết phiếu trả hàng</span>
    <div style="margin-left:auto" id="theme-toggle-container"></div>
  </header>

  <main class="app-main">
    <div class="app-content" style="padding-top: var(--spacing-md);">
      <!-- Search -->
      <div class="search-wrap">
        <span class="search-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </span>
        <input type="text" id="search-input" placeholder="Tìm theo mã SP, tên SP...">
      </div>

      <!-- Skeleton -->
      <div id="detail-skeleton">
        <div class="detail-section">
          <div class="skeleton skeleton-detail-header"></div>
          <div class="skeleton skeleton-product"></div>
          <div class="skeleton skeleton-product"></div>
          <div class="skeleton skeleton-summary"></div>
        </div>
      </div>

      <!-- Nội dung -->
      <div id="detail-content" hidden>
        <div class="detail-section">
          <div class="detail-title">Chi tiết phiếu trả hàng</div>
          <div id="return-header"></div>
        </div>

        <div class="detail-section">
          <div class="section-subtitle">Danh sách sản phẩm</div>
          <div id="product-list"></div>
        </div>

        <div id="return-summary"></div>
      </div>
    </div>
  </main>

  <div id="sidebar-container"></div>
  <div id="nav-container"></div>
  <script src="src/js/components/NavBar.js"></script>
  <script src="src/js/components/TotalBar.js"></script>
    <script src="src/js/pages/return-order-detail.js"></script>
    <script src="src/pwa/pwa-register.js"></script>
</body>

</html>
