<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="src/pwa/manifest.json">
    <meta name="theme-color" content="#3c50e0">
    <link rel="apple-touch-icon" href="images/logo/medstand-logo.png">
  <title>Khảo sát - Medstand</title>
  <link rel="stylesheet" href="src/css/design-tokens.css">
  <link rel="stylesheet" href="src/css/global.css">
  <link rel="stylesheet" href="src/css/components/header.css">
  <link rel="stylesheet" href="src/css/components/card.css">
  <link rel="stylesheet" href="src/css/components/nav-bar.css">
  <link rel="stylesheet" href="src/css/components/skeleton.css">
  <link rel="stylesheet" href="src/css/components/confirm-modal.css">
  <link rel="stylesheet" href="src/css/layouts/desktop.css">
  <style>
    .segment {
      display: flex;
      gap: 16px;
      margin-bottom: var(--spacing-md);
      border-bottom: 1px solid var(--color-border);
    }

    .segment-item {
      border: none;
      background: none;
      padding: 8px 0;
      color: var(--color-text-muted);
      cursor: pointer;
      font-size: 1rem;
    }

    .segment-item.active {
      color: var(--color-primary);
      font-weight: 600;
      border-bottom: 2px solid var(--color-primary);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* detail page styles */
    .detail-content {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 16px;
      background: var(--color-surface);
      border-radius: var(--radius-xl);
      border: 1px solid var(--color-border);
      box-shadow: var(--shadow-card);
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid var(--color-border);
    }

    .info-label {
      color: var(--color-text);
    }

    .info-value {
      color: var(--color-primary);
      font-weight: 600;
    }

    .btn-start {
      width: 100%;
      padding: 14px;
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: 16px;
      font-weight: 600;
      font-size: 1rem;
      margin-top: 32px;
      cursor: pointer;
    }

    /* quiz styles (needed when start parameter present) */
    .timer-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      color: var(--color-primary);
      font-weight: 500;
    }

    .question-nav {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      justify-content: center;
    }

    .question-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(var(--color-primary-rgb), 0.1);
      color: var(--color-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border .2s;
    }

    .question-circle.active {
      background: var(--color-primary);
      color: #fff;
      border-color: var(--color-primary);
    }

    .question-card {
      background: var(--color-surface);
      border-radius: 16px;
      border: 1px solid var(--color-border);
      box-shadow: var(--shadow-card);
      padding: 16px;
      margin-bottom: 16px;
    }

    .question-title {
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 8px;
    }

    .answer-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .answer-radio {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
      cursor: pointer;
    }

    .answer-radio input[type=radio] {
      accent-color: var(--color-primary);
      width: 20px;
      height: 20px;
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 24px;
      gap: 8px;
    }

    .nav-btn,
    .submit-btn {
      padding: 12px 20px;
      border-radius: 16px;
      border: none;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
    }

    .nav-btn {
      background: rgba(var(--color-primary-rgb), 0.1);
      color: var(--color-primary);
    }

    .submit-btn {
      background: var(--color-primary);
      color: #fff;
    }

    @media (min-width:768px) {
      .app-content {
        max-width: 600px;
        margin: auto;
      }
    }
  </style>
  <script src="src/js/utils/theme.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cash/8.1.5/cash.min.js"></script>
  <script src="src/js/components/Alert.js"></script>
  <script src="src/js/config/api.config.js"></script>
  <script src="src/js/services/http.js"></script>
</head>

<body>
  <header class="app-header" style="justify-content: flex-start; gap: 12px;">
    <a href="account.html" style="text-decoration: none; color: var(--color-text-muted);">←</a>
    <span style="color: var(--color-primary); font-weight: 600;">Khảo sát</span>
  </header>
  <div id="sidebar-container"></div>
  <main class="app-main">
    <div class="app-content" id="content-area">
      <!-- detail or quiz inserted by script -->
    </div>
  </main>
  <div id="nav-container"></div>
  <script src="src/js/components/NavBar.js"></script>
  <script src="src/js/components/ConfirmModal.js"></script>
    <script src="src/js/pages/survey.js"></script>
    <script src="src/pwa/pwa-register.js"></script>
</body>

</html>
