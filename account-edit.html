<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="src/pwa/manifest.json">
    <meta name="theme-color" content="#3c50e0">
    <link rel="apple-touch-icon" href="images/logo/medstand-logo.png">
  <title>Chỉnh sửa tài khoản - Medstand</title>
  <link rel="stylesheet" href="src/css/design-tokens.css">
  <link rel="stylesheet" href="src/css/global.css">
  <link rel="stylesheet" href="src/css/components/header.css">
  <link rel="stylesheet" href="src/css/components/nav-bar.css">
  <link rel="stylesheet" href="src/css/layouts/desktop.css">
  <script src="src/js/utils/theme.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cash/8.1.5/cash.min.js"></script>
  <script src="src/js/components/Alert.js"></script>
  <script src="src/js/config/api.config.js"></script>
  <script src="src/js/services/http.js"></script>
  <script src="src/js/components/SurveyCheck.js"></script>
  <script src="src/js/services/auth.service.js"></script>
  <style>
    body[data-page="account-edit"] {
      background: var(--color-surface);
    }

    .edit-wrap {
      padding: 16px;
      max-width: 540px;
      margin: 0 auto;
    }

    /* Avatar picker */
    .avatar-picker {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    .avatar-preview {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--color-primary);
      cursor: pointer;
    }

    .avatar-hint {
      font-size: var(--font-size-xs);
      color: var(--color-text-muted);
    }

    #avatarInput { display: none; }

    /* Form fields */
    .field-group { margin-bottom: 16px; }

    .field-label {
      display: block;
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-medium);
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
      margin-bottom: 6px;
    }

    .field-input {
      display: block;
      width: 100%;
      padding: 11px 14px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      font-size: var(--font-size-sm);
      color: var(--color-text);
      box-sizing: border-box;
      transition: border-color var(--transition-fast);
    }

    .field-input:focus {
      outline: none;
      border-color: var(--color-primary);
    }

    .field-input[readonly] {
      opacity: 0.55;
      cursor: not-allowed;
      background: var(--color-border);
    }

    /* Gender radio */
    .gender-row { display: flex; gap: 16px; flex-wrap: wrap; }

    .gender-option {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: var(--font-size-sm);
      color: var(--color-text);
    }

    .gender-option input[type="radio"] {
      accent-color: var(--color-primary);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    /* Save button */
    .btn-save {
      width: 100%;
      padding: 14px;
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 8px;
      letter-spacing: 0.04em;
      transition: opacity var(--transition-fast);
    }

    .btn-save:hover { opacity: 0.9; }
    .btn-save:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>

<body data-page="account-edit">
  <header class="app-header" style="justify-content: flex-start; gap: 12px;">
    <a href="account-detail.html"
      style="text-decoration: none; color: var(--color-text-muted); font-size: 1.2rem;">←</a>
    <span style="color: var(--color-primary); font-weight: 600; font-size: var(--font-size-lg);">Chỉnh sửa tài khoản</span>
  </header>

  <main class="app-main">
    <div class="app-content">
      <div class="edit-wrap">

        <!-- Avatar -->
        <div class="avatar-picker">
          <img id="avatarPreview"
            src="https://ui-avatars.com/api/?name=User&size=96&background=3c50e0&color=fff"
            alt="Avatar" class="avatar-preview"
            onclick="document.getElementById('avatarInput').click()">
          <input type="file" id="avatarInput" accept="image/*">
          <span class="avatar-hint">Nhấn vào ảnh để thay đổi avatar</span>
        </div>

        <!-- Họ và tên -->
        <div class="field-group">
          <label class="field-label" for="fieldDisplayName">Họ và tên</label>
          <input type="text" class="field-input" id="fieldDisplayName" placeholder="Họ và tên">
        </div>

        <!-- Tên đăng nhập (readonly) -->
        <div class="field-group">
          <label class="field-label" for="fieldUserName">Tên đăng nhập</label>
          <input type="text" class="field-input" id="fieldUserName" placeholder="Tên đăng nhập" readonly>
        </div>

        <!-- Email -->
        <div class="field-group">
          <label class="field-label" for="fieldEmail">Email</label>
          <input type="email" class="field-input" id="fieldEmail" placeholder="Email">
        </div>

        <!-- Ngày sinh -->
        <div class="field-group">
          <label class="field-label" for="fieldNgaySinh">Ngày sinh</label>
          <input type="date" class="field-input" id="fieldNgaySinh">
        </div>

        <!-- Giới tính -->
        <div class="field-group">
          <label class="field-label">Giới tính</label>
          <div class="gender-row">
            <label class="gender-option">
              <input type="radio" name="gioiTinh" value="Nam"> Nam
            </label>
            <label class="gender-option">
              <input type="radio" name="gioiTinh" value="Nữ"> Nữ
            </label>
            <label class="gender-option">
              <input type="radio" name="gioiTinh" value="Khác"> Khác
            </label>
          </div>
        </div>

        <button type="button" class="btn-save" id="btnSave">LƯU THAY ĐỔI</button>
      </div>
    </div>
  </main>

  <div id="sidebar-container"></div>
  <div id="nav-container"></div>
  <script src="src/js/components/NavBar.js"></script>
    <script src="src/js/pages/account-edit.js"></script>
    <script src="src/pwa/pwa-register.js"></script>
</body>

</html>
