<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="src/pwa/manifest.json">
    <meta name="theme-color" content="#3c50e0">
    <link rel="apple-touch-icon" href="images/logo/medstand-logo.png">
  <title>Đổi mật khẩu - Medstand</title>
  <link rel="stylesheet" href="src/css/design-tokens.css">
  <link rel="stylesheet" href="src/css/global.css">
  <link rel="stylesheet" href="src/css/components/header.css">
  <link rel="stylesheet" href="src/css/components/nav-bar.css">
  <link rel="stylesheet" href="src/css/components/confirm-modal.css">
  <link rel="stylesheet" href="src/css/layouts/desktop.css">
  <style>
    /* Ẩn icon mặc định của trình duyệt (Edge) */
    input::-ms-reveal,
    input::-ms-clear { display: none; }

    .pw-wrap {
      padding: 24px 16px;
      max-width: 480px;
      margin: 0 auto;
    }

    .pw-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-card);
      padding: 24px;
    }

    .pw-form {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    /* Tái sử dụng pattern ô nhập của login */
    .form-group { margin-bottom: var(--spacing-md); }

    .form-label {
      display: block;
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-medium);
      color: var(--color-text-secondary);
      margin-bottom: 6px;
    }

    .input-wrap { position: relative; }

    .input-wrap .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--color-text-muted);
      pointer-events: none;
      display: flex;
    }

    .form-input {
      width: 100%;
      font-family: var(--font-family);
      font-size: var(--font-size-md);
      color: var(--color-text);
      background: var(--color-background);
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 12px 14px 12px 44px;
      outline: none;
      box-sizing: border-box;
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
    }

    .form-input:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(var(--color-primary-rgb), .12);
    }

    .form-input.has-toggle { padding-right: 44px; }

    .btn-toggle-pw {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--color-text-muted);
      padding: 4px;
      display: flex;
      border-radius: var(--radius-sm);
      transition: color var(--transition-fast);
    }

    .btn-toggle-pw:hover { color: var(--color-primary); }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: var(--radius-md);
      font-family: var(--font-family);
      font-weight: var(--font-weight-semibold);
      font-size: var(--font-size-md);
      cursor: pointer;
      margin-top: 8px;
      letter-spacing: 1px;
      transition: background var(--transition-fast), box-shadow var(--transition-fast);
    }

    .btn-submit:hover {
      background: var(--color-primary-hover);
      box-shadow: 0 4px 12px rgba(60,80,224,.3);
    }

    .btn-submit:disabled { opacity: .6; cursor: not-allowed; }

    .pw-error {
      color: var(--color-danger, #dc2626);
      font-size: var(--font-size-sm);
      text-align: center;
      min-height: 20px;
    }

    .pw-success {
      color: var(--color-success, #16a34a);
      font-size: var(--font-size-sm);
      text-align: center;
    }
  </style>
  <script src="src/js/utils/theme.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cash/8.1.5/cash.min.js"></script>
  <script src="src/js/config/api.config.js"></script>
  <script src="src/js/services/http.js"></script>
  <script src="src/js/components/SurveyCheck.js"></script>
</head>

<body>
  <header class="app-header" style="justify-content: flex-start; gap: 12px;">
    <a href="account.html" style="text-decoration: none; color: var(--color-text-muted); font-size:1.2rem">←</a>
    <span style="color: var(--color-primary); font-weight: 600;">Đổi mật khẩu</span>
  </header>
  <div id="sidebar-container"></div>
  <main class="app-main">
    <div class="app-content">
      <div class="pw-wrap">
        <div class="pw-card">
          <div class="pw-form">
        <!-- Mật khẩu hiện tại -->
        <div class="form-group">
          <label class="form-label" for="current-pw">Mật khẩu hiện tại</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input type="password" id="current-pw" class="form-input has-toggle" placeholder="Nhập mật khẩu hiện tại" autocomplete="current-password">
            <button type="button" class="btn-toggle-pw" data-target="current-pw" aria-label="Hiện/Ẩn mật khẩu">
              <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>

        <!-- Mật khẩu mới -->
        <div class="form-group">
          <label class="form-label" for="new-pw">Mật khẩu mới</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input type="password" id="new-pw" class="form-input has-toggle" placeholder="Nhập mật khẩu mới" autocomplete="new-password">
            <button type="button" class="btn-toggle-pw" data-target="new-pw" aria-label="Hiện/Ẩn mật khẩu">
              <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>

        <!-- Xác nhận mật khẩu -->
        <div class="form-group">
          <label class="form-label" for="confirm-pw">Xác nhận mật khẩu mới</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input type="password" id="confirm-pw" class="form-input has-toggle" placeholder="Nhập lại mật khẩu mới" autocomplete="new-password">
            <button type="button" class="btn-toggle-pw" data-target="confirm-pw" aria-label="Hiện/Ẩn mật khẩu">
              <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>

        <div id="pw-msg" class="pw-error"></div>
        <button class="btn-submit" id="btn-update">CẬP NHẬT</button>
          </div>
        </div>
      </div>
    </div>
  </main>
  <div id="nav-container"></div>
  <script src="src/js/components/NavBar.js"></script>
  <script src="src/js/components/ConfirmModal.js"></script>
    <script src="src/js/pages/change-password.js"></script>
    <script src="src/pwa/pwa-register.js"></script>
</body>

</html>
