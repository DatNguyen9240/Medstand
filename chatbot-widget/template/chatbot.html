<!-- AI Chatbot Page -->
<header class="app-header">
    <button type="button" class="header-icon" id="btn-back" aria-label="Quay lại" onclick="history.back()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5"></path>
            <path d="M12 19l-7-7 7-7"></path>
        </svg>
    </button>
    <div class="header-info">
        <p class="header-username" style="font-size:var(--font-size-md)">AI Trợ lý</p>
    </div>
    <button type="button" class="header-icon" id="btn-clear-chat" aria-label="Xóa lịch sử">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
    </button>
</header>

<div class="chat-container" id="chat-container">
    <!-- Welcome message -->
    <div class="chat-welcome" id="chat-welcome">
        <div class="chat-welcome-icon">🤖</div>
        <h3 class="chat-welcome-title">Xin chào!</h3>
        <p class="chat-welcome-text">Tôi là trợ lý AI của bạn. Hãy hỏi tôi bất cứ điều gì!</p>
        <div class="chat-suggestions" id="chat-suggestions">
            <button type="button" class="chat-chip" data-msg="Doanh số tháng này">📊 Doanh số tháng này</button>
            <button type="button" class="chat-chip" data-msg="Top khách hàng mua nhiều nhất">👥 Top khách hàng</button>
            <button type="button" class="chat-chip" data-msg="Đơn hàng chờ duyệt hôm nay">📦 Đơn chờ duyệt</button>
            <button type="button" class="chat-chip" data-msg="Sản phẩm bán chạy nhất tuần này">🔥 SP bán chạy</button>
        </div>
    </div>

    <!-- Messages area -->
    <div class="chat-messages" id="chat-messages"></div>
</div>

<!-- Input area -->
<div class="chat-input-bar" id="chat-input-bar">
    <!-- File preview (multi-file) -->
    <div class="chat-file-list-wrap" id="chat-file-preview" style="display:none">
        <div class="chat-file-list" id="chat-file-list"></div>
    </div>

    <input type="file" id="chat-file-input" hidden multiple
        accept=".jpg,.jpeg,.png,.gif,.webp,.pdf,.doc,.docx,.xls,.xlsx,.csv,.txt">
    <div class="chat-input-wrap">
        <!-- Attach button -->
        <button type="button" class="chat-action-btn chat-attach-btn" id="btn-attach" aria-label="Đính kèm file">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path
                    d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48">
                </path>
            </svg>
        </button>

        <!-- API button -->
        <button type="button" class="chat-action-btn chat-api-btn" id="btn-api" aria-label="Chọn API">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7" rx="1"></rect>
                <rect x="14" y="3" width="7" height="7" rx="1"></rect>
                <rect x="3" y="14" width="7" height="7" rx="1"></rect>
                <circle cx="17.5" cy="17.5" r="3.5"></circle>
            </svg>
        </button>

        <textarea class="chat-input" id="chat-input" placeholder="Nhập tin nhắn... (@ tra cứu)" rows="1"
            autocomplete="off"></textarea>

        <!-- Send button -->
        <button type="button" class="chat-send-btn" id="btn-send" aria-label="Gửi" disabled>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
        </button>
    </div>
</div>

<!-- CSS & JS được router.js nạp đúng path, không cần link lại ở đây -->
