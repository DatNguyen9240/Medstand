<!-- AI Chatbot Page -->
<!-- Header đã bị ẩn theo yêu cầu -->
<header class="app-header" style="display: none;">
    <button type="button" class="header-icon" id="btn-back" aria-label="Quay lại" onclick="history.back()"></button>
    <div class="header-info"></div>

</header>

<div class="chat-container" id="chat-container">
    <button type="button" class="chat-action-btn chat-theme-btn-floating" id="btn-theme-chatbot" aria-label="Đổi giao diện" title="Đổi giao diện (Sáng/Tối)">
        <svg id="chatbot-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg id="chatbot-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
    </button>
    <button type="button" class="chat-action-btn chat-clear-btn chat-clear-btn-floating" id="btn-clear-chat" aria-label="Xóa chat" title="Xóa lịch sử trò chuyện">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2 2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
    </button>
    <div class="chat-welcome" id="chat-welcome" style="display: none;">
        <div class="chat-welcome-icon">🤖</div>
        <h2 class="chat-welcome-title">Xin chào!</h2>
        <p class="chat-welcome-text">Tôi là trợ lý AI của bạn. Hãy hỏi tôi bất cứ điều gì!</p>
        <div class="chat-suggestions">
            <button class="chat-chip" type="button" onclick="document.getElementById('chat-input').value='@doanh_so '; document.getElementById('chat-input').dispatchEvent(new Event('input', {bubbles:true})); document.getElementById('chat-input').focus();">📊 Tra cứu doanh số</button>
            <button class="chat-chip" type="button" onclick="document.getElementById('chat-input').value='@danh_sach_tonkho '; document.getElementById('chat-input').dispatchEvent(new Event('input', {bubbles:true})); document.getElementById('chat-input').focus();">📦 Kiểm tra tồn kho</button>
            <button class="chat-chip" type="button" onclick="document.getElementById('chat-input').value='@san_pham_trong_tam '; document.getElementById('chat-input').dispatchEvent(new Event('input', {bubbles:true})); document.getElementById('chat-input').focus();">🔥 Hàng trọng tâm</button>
            <button class="chat-chip" type="button" onclick="if(window.ApiEngine) { window.ApiEngine.selectApi('@lap_don_hang'); } else { document.getElementById('chat-input').value='@lap_don_hang '; document.getElementById('chat-input').dispatchEvent(new Event('input', {bubbles:true})); document.getElementById('chat-input').focus(); }">🛒 Thêm đơn hàng</button>
        </div>
    </div>

    <!-- Messages area -->
    <div class="chat-messages" id="chat-messages"></div>
</div>

<!-- Input area -->
<div class="chat-input-bar" id="chat-input-bar">
    <!-- File preview (multi-file) -->
    <div class="chat-file-list-wrap" id="chat-file-preview" style="display:none">
        <div class="chat-file-list" id="chat-file-list"></div>
    </div>

    <input type="file" id="chat-file-input" hidden multiple
        accept=".jpg,.jpeg,.png,.gif,.webp,.pdf,.doc,.docx,.xls,.xlsx,.csv,.txt">
    <div class="chat-input-wrap">
        <!-- Attach button -->
        <button type="button" class="chat-action-btn chat-attach-btn" id="btn-attach" aria-label="Đính kèm file">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path
                    d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48">
                </path>
            </svg>
        </button>

        <!-- API button -->
        <button type="button" class="chat-action-btn chat-api-btn" id="btn-api" aria-label="Chọn API">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7" rx="1"></rect>
                <rect x="14" y="3" width="7" height="7" rx="1"></rect>
                <rect x="3" y="14" width="7" height="7" rx="1"></rect>
                <circle cx="17.5" cy="17.5" r="3.5"></circle>
            </svg>
        </button>

        <textarea class="chat-input" id="chat-input" placeholder="Nhập tin nhắn... (@ tra cứu)" rows="1"
            autocomplete="off" spellcheck="false"></textarea>

        <!-- Send button -->
        <button type="button" class="chat-send-btn" id="btn-send" aria-label="Gửi" disabled>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
        </button>
    </div>
</div>

<!-- CSS & JS được router.js nạp đúng path, không cần link lại ở đây -->
