  <style>
    /* ── Add Customer Modal ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .45);
      z-index: 150;
      align-items: flex-end;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-sheet {
      width: 100%;
      max-height: 92vh;
      max-height: 92dvh;
      background: var(--color-surface);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: translateY(100%);
      transition: transform .28s cubic-bezier(.4, 0, .2, 1);
    }

    .modal-overlay.active .modal-sheet {
      transform: translateY(0);
    }

    .modal-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      border-bottom: 1px solid var(--color-border);
      flex-shrink: 0;
    }

    .modal-header .btn-back {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--color-primary);
      font-size: 1.2rem;
      padding: 4px;
    }

    .modal-header h2 {
      font-size: var(--font-size-lg);
      font-weight: 700;
      color: var(--color-primary);
      margin: 0;
    }

    .modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      align-content: start;
    }

    /* Tablet: 2 cột */
    @media (min-width: 600px) {
      .modal-body {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* Desktop: 3 cột */
    @media (min-width: 1024px) {
      .modal-body {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    /* Fields cần span toàn bộ chiều rộng */
    .form-group.full {
      grid-column: 1 / -1;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: var(--font-size-sm);
      color: var(--color-text);
      font-weight: var(--font-weight-medium);
    }

    .form-group label .req {
      color: #e3342f;
      margin-left: 2px;
    }

    .form-input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: var(--color-background);
      color: var(--color-text);
      font-size: var(--font-size-sm);
      font-family: var(--font-family);
      outline: none;
      transition: border-color .15s;
      box-sizing: border-box;
    }

    .form-input:focus {
      border-color: var(--color-primary);
    }

    .form-select {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: var(--color-background);
      color: var(--color-text-muted);
      font-size: var(--font-size-sm);
      cursor: pointer;
    }

    .form-select.has-value {
      color: var(--color-text);
    }

    .form-select svg {
      flex-shrink: 0;
      color: var(--color-text-muted);
    }

    .modal-footer {
      padding: 12px 16px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      flex-shrink: 0;
    }

    .btn-confirm {
      width: 100%;
      padding: 15px;
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: var(--radius-md);
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: .04em;
      cursor: pointer;
      transition: opacity .15s;
    }

    .btn-confirm:active {
      opacity: .85;
    }

    .btn-confirm:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    /* ── Map Picker ── */
    .map-picker-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      flex-direction: column;
      background: var(--color-surface);
    }

    .map-picker-overlay.active {
      display: flex;
    }

    .map-picker-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--color-border);
      flex-shrink: 0;
    }

    .map-picker-header h3 {
      margin: 0;
      font-size: var(--font-size-md);
      color: var(--color-primary);
    }

    #map-picker-container {
      flex: 1;
    }

    .map-picker-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--color-border);
      display: flex;
      gap: 10px;
    }

    .btn-map-confirm {
      flex: 1;
      padding: 13px;
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: var(--radius-md);
      font-size: var(--font-size-sm);
      font-weight: 700;
      cursor: pointer;
    }

    .btn-map-cancel {
      padding: 13px 20px;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text);
      border-radius: var(--radius-md);
      font-size: var(--font-size-sm);
      font-weight: 600;
      cursor: pointer;
    }

    #map-selected-info {
      font-size: var(--font-size-xs);
      color: var(--color-text-muted);
      padding: 6px 16px;
      background: var(--color-background);
      border-bottom: 1px solid var(--color-border);
      min-height: 32px;
      display: flex;
      align-items: center;
    }

    .customer-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: var(--spacing-md);
      margin-bottom: var(--spacing-md);
      position: relative;
      padding-right: 64px;
      transition: border-color var(--transition-fast), background-color var(--transition-normal);
    }

    .customer-card:hover {
      border-color: var(--color-border-strong);
    }

    .customer-card .name {
      color: var(--color-primary);
      font-weight: var(--font-weight-semibold);
      margin-bottom: var(--spacing-xs);
      font-size: var(--font-size-sm);
    }

    .customer-card .row {
      font-size: var(--font-size-xs);
      color: var(--color-text-muted);
      margin-bottom: var(--spacing-xs);
      line-height: 1.5;
    }

    .customer-card .btn-call {
      position: absolute;
      right: var(--spacing-md);
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      border-radius: var(--radius-full);
      background: var(--color-phone-bg);
      color: var(--color-phone-icon);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.125rem;
      cursor: pointer;
      text-decoration: none;
      transition: transform var(--transition-fast);
    }

    .customer-card .btn-call:hover {
      transform: translateY(-50%) scale(1.08);
    }

    .fab {
      position: fixed;
      right: var(--spacing-lg);
      bottom: calc(var(--nav-height) + var(--spacing-lg));
      width: 56px;
      height: 56px;
      border-radius: var(--radius-full);
      background: var(--color-primary);
      color: white;
      border: none;
      font-size: 1.5rem;
      box-shadow: var(--shadow-lg);
      cursor: pointer;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: background var(--transition-fast), box-shadow var(--transition-fast);
    }

    .fab:hover {
      background: var(--color-primary-hover);
      color: white;
      box-shadow: 0 6px 20px rgba(var(--color-primary-rgb), 0.4);
    }
  </style>
</head>

<body>
  <header class="app-header" style="justify-content: flex-start; gap: 12px; padding: 0 16px;">
    <a href="account.html" style="text-decoration: none; color: var(--color-text-muted); font-size:1.2rem">←</a>
    <span style="color: var(--color-primary); font-weight: 600;">Quản lý khách hàng</span>
    <div style="margin-left:auto" id="theme-toggle-container"></div>
  </header>
  <main class="app-main">
    <div class="app-content">
      <div id="filter-container"></div>
      <div id="skeleton">
        <div class="skeleton skeleton-card" style="margin-bottom:16px;min-height:120px"></div>
        <div class="skeleton skeleton-card" style="min-height:120px"></div>
      </div>
      <div id="customer-list" hidden></div>
    </div>
  </main>
  <!-- FAB -->
  <button type="button" class="fab" id="btn-add-customer" aria-label="Thêm khách hàng">+</button>

  <!-- Modal Thêm khách hàng -->
  <div class="modal-overlay" id="modal-add-customer" role="dialog" aria-modal="true" aria-label="Thêm khách hàng">
    <div class="modal-sheet">
      <div class="modal-header">
        <button type="button" class="btn-back" id="modal-close" aria-label="Đóng">←</button>
        <h2>Thêm khách hàng</h2>
      </div>
      <div class="modal-body" id="customerFormContainer"></div>
      <div class="modal-footer">
        <button type="button" class="btn-confirm" id="btn-confirm-customer">XÁC NHẬN</button>
      </div>
    </div>
  </div>
  <div id="sidebar-container"></div>
  <div id="nav-container"></div>
  <script src="src/js/components/NavBar.js"></script>
  <script src="src/js/components/FilterComponent.js"></script>
  <script src="src/js/components/TotalBar.js"></script>
  <script src="src/js/components/FormSelect.js"></script>
  <script src="src/js/components/MapPicker.js"></script>
    <script src="src/js/pages/customer-management.js"></script>
