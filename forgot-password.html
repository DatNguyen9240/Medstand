<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="src/pwa/manifest.json">
    <meta name="theme-color" content="#3c50e0">
    <link rel="apple-touch-icon" href="images/logo/medstand-logo.png">
  <title>Quên mật khẩu - Medstand</title>
  <link rel="stylesheet" href="src/css/design-tokens.css">
  <script src="src/js/utils/theme.js"></script>
  <script src="src/js/config/api.config.js"></script>
  <script src="src/js/services/http.js"></script>
  <script src="src/js/components/Alert.js"></script>
  <script src="src/js/components/AuthThemeToggle.js"></script>
  <script src="src/js/components/PasswordToggle.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cash/8.1.5/cash.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    input::-ms-reveal,
    input::-ms-clear {
      display: none;
    }

    body {
      min-height: 100vh;
      font-family: var(--font-family);
      background: var(--color-background);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--spacing-lg);
      transition: background-color var(--transition-normal);
    }

    .auth-card {
      background: var(--color-surface);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 420px;
      padding: var(--spacing-xl) var(--spacing-lg);
      animation: slideUp .35s ease both;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(24px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .auth-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: var(--spacing-xl);
      gap: 12px;
    }

    .auth-logo-icon {
      width: 64px;
      height: 64px;
      border-radius: var(--radius-lg);
      background: linear-gradient(135deg, var(--color-primary), #6366f1);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(60, 80, 224, .35);
    }

    .auth-logo-icon svg {
      color: #fff;
    }

    .auth-title {
      font-size: var(--font-size-title);
      font-weight: var(--font-weight-bold);
      color: var(--color-text);
    }

    .auth-subtitle {
      font-size: var(--font-size-sm);
      color: var(--color-text-muted);
      margin-top: 2px;
    }

    .form-group {
      margin-bottom: var(--spacing-md);
    }

    .form-label {
      display: block;
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-medium);
      color: var(--color-text-secondary);
      margin-bottom: 6px;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--color-text-muted);
      pointer-events: none;
      display: flex;
    }

    .form-input {
      width: 100%;
      font-family: var(--font-family);
      font-size: var(--font-size-md);
      color: var(--color-text);
      background: var(--color-background);
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 12px 14px 12px 44px;
      outline: none;
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast),
        background-color var(--transition-normal);
    }

    .form-input:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(var(--color-primary-rgb), .12);
    }

    .form-input.has-toggle {
      padding-right: 44px;
    }

    .btn-toggle-pw {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--color-text-muted);
      padding: 4px;
      display: flex;
      border-radius: var(--radius-sm);
      transition: color var(--transition-fast);
    }

    .btn-toggle-pw:hover {
      color: var(--color-primary);
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: var(--radius-md);
      font-family: var(--font-family);
      font-size: var(--font-size-md);
      font-weight: var(--font-weight-semibold);
      cursor: pointer;
      transition: background var(--transition-fast), transform 0.1s, box-shadow var(--transition-fast);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: var(--spacing-md);
    }

    .btn-primary:hover {
      background: var(--color-primary-hover);
      box-shadow: 0 4px 12px rgba(60, 80, 224, .3);
    }

    .btn-primary:active {
      transform: scale(.98);
    }

    .btn-primary:disabled {
      opacity: .6;
      cursor: not-allowed;
      transform: none;
    }

    .btn-spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, .4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: none;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .alert-error {
      background: rgba(239, 68, 68, .08);
      border: 1px solid rgba(239, 68, 68, .25);
      color: #ef4444;
      border-radius: var(--radius-md);
      padding: 10px 14px;
      font-size: var(--font-size-sm);
      margin-bottom: var(--spacing-md);
      display: none;
    }

    .auth-footer {
      text-align: center;
      font-size: var(--font-size-sm);
      color: var(--color-text-muted);
      margin-top: var(--spacing-sm);
    }

    .link {
      font-size: var(--font-size-sm);
      color: var(--color-primary);
      text-decoration: none;
      font-weight: var(--font-weight-medium);
    }

    .link:hover {
      text-decoration: underline;
    }

    .theme-btn {
      position: fixed;
      top: 16px;
      right: 16px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-full);
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--color-text-muted);
      box-shadow: var(--shadow-sm);
      transition: background var(--transition-fast), color var(--transition-fast);
    }

    .theme-btn:hover {
      color: var(--color-primary);
    }

    /* Steps indicator */
    .steps {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: var(--spacing-lg);
    }

    .step-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--color-border);
      transition: background var(--transition-fast), transform var(--transition-fast);
    }

    .step-dot.active {
      background: var(--color-primary);
      transform: scale(1.2);
    }
  </style>
</head>

<body>
  <!-- Theme toggle -->
  <button class="theme-btn" id="btn-theme" aria-label="Đổi giao diện">
    <svg id="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
    </svg>
    <svg id="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      style="display:none">
      <circle cx="12" cy="12" r="5" />
      <line x1="12" y1="1" x2="12" y2="3" />
      <line x1="12" y1="21" x2="12" y2="23" />
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
      <line x1="1" y1="12" x2="3" y2="12" />
      <line x1="21" y1="12" x2="23" y2="12" />
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
    </svg>
  </button>

  <div class="auth-card">
    <!-- Logo -->
    <div class="auth-logo">
      <img src="images/logo/medstand-logo.png" alt="Medstand Pharma" style="max-width: 200px; height: auto;">
      <div>
        <div class="auth-subtitle">Đặt lại mật khẩu tài khoản của bạn</div>
      </div>
    </div>

    <!-- Steps indicator -->
    <div class="steps">
      <div class="step-dot active" id="dot-1"></div>
      <div class="step-dot" id="dot-2"></div>
    </div>

    <div id="form-error" class="alert-error" role="alert"></div>

    <!-- Step 1: Nhập tên đăng nhập -->
    <div id="step-1">
      <div class="form-group">
        <label class="form-label" for="username">Tên đăng nhập</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
          </span>
          <input type="text" id="username" class="form-input" placeholder="Nhập tên đăng nhập" autocomplete="username"
            required>
        </div>
      </div>

      <button type="button" class="btn-primary" id="btn-next">
        <span>Tiếp tục</span>
      </button>
    </div>

    <!-- Step 2: Nhập mật khẩu mới -->
    <div id="step-2" style="display:none">
      <div class="form-group">
        <label class="form-label" for="new-pw">Mật khẩu mới</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
          </span>
          <input type="password" id="new-pw" class="form-input has-toggle" placeholder="Nhập mật khẩu mới"
            autocomplete="new-password">
          <button type="button" class="btn-toggle-pw" data-target="new-pw" aria-label="Hiện/Ẩn mật khẩu">
            <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <svg class="eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" style="display:none">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirm-pw">Xác nhận mật khẩu mới</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
          </span>
          <input type="password" id="confirm-pw" class="form-input has-toggle" placeholder="Nhập lại mật khẩu mới"
            autocomplete="new-password">
          <button type="button" class="btn-toggle-pw" data-target="confirm-pw" aria-label="Hiện/Ẩn mật khẩu">
            <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <svg class="eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" style="display:none">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
          </button>
        </div>
      </div>

      <button type="button" class="btn-primary" id="btn-reset">
        <span class="btn-spinner" id="reset-spinner"></span>
        <span id="btn-reset-text">Đặt lại mật khẩu</span>
      </button>
    </div>

    <div class="auth-footer">
      <a href="login.html" class="link">← Quay lại đăng nhập</a>
    </div>
  </div>

  <script>
    AuthThemeToggle.bind();
    PasswordToggle.init();

    // ── State ─────────────────────────────────────────────────────────────────
    var _username = '';
    var $error = $('#form-error');

    function showError(msg) {
      $error.text(msg).show();
    }
    function clearError() {
      $error.hide().text('');
    }

    // ── Step 1: Nhập username → chuyển step 2 ────────────────────────────────
    $('#btn-next').on('click', function () {
      clearError();
      var username = $('#username').val().trim();

      if (!username) {
        showError('Vui lòng nhập tên đăng nhập.');
        return;
      }

      _username = username;

      // Chuyển sang step 2
      $('#step-1').hide();
      $('#step-2').show();
      $('#dot-1').removeClass('active');
      $('#dot-2').addClass('active');
      $('#new-pw').focus();
    });

    // ── Step 2: Đặt lại mật khẩu ────────────────────────────────────────────
    $('#btn-reset').on('click', function () {
      clearError();
      var newPw = $('#new-pw').val().trim();
      var confirmPw = $('#confirm-pw').val().trim();

      if (!newPw) { showError('Vui lòng nhập mật khẩu mới.'); return; }
      if (newPw.length < 6) { showError('Mật khẩu mới tối thiểu 6 ký tự.'); return; }
      if (newPw !== confirmPw) { showError('Xác nhận mật khẩu không khớp.'); return; }

      var $btn = $(this);
      $btn.prop('disabled', true);
      $('#reset-spinner').show();
      $('#btn-reset-text').text('Đang xử lý...');

      Http.post(API_CONFIG.ENDPOINTS.AUTH.CHANGE_PASSWORD, {
        UserName: _username,
        OldPassword: '',
        NewPassword: newPw
      }).then(function (res) {
        var data = res.data !== undefined ? res.data : res;
        var code = data.code !== undefined ? data.code : (data.Code !== undefined ? data.Code : -1);
        var msg = data.msg || data.Msg || '';

        if (code === 0) {
          Alert.success(msg || 'Đặt lại mật khẩu thành công! Đang chuyển đến đăng nhập...');
          setTimeout(function () {
            window.location.href = 'login.html';
          }, 2000);
        } else {
          showError(msg || 'Đặt lại mật khẩu thất bại.');
        }
      }).catch(function (err) {
        showError(err.message || 'Lỗi kết nối. Vui lòng thử lại.');
      }).finally(function () {
        $btn.prop('disabled', false);
        $('#reset-spinner').hide();
        $('#btn-reset-text').text('Đặt lại mật khẩu');
      });
    });

    // Enter key support
    $('#username').on('keydown', function (e) {
      if (e.key === 'Enter') $('#btn-next').click();
    });
    $('#confirm-pw').on('keydown', function (e) {
      if (e.key === 'Enter') $('#btn-reset').click();
    });
  </script>
    <script src="src/pwa/pwa-register.js"></script>
</body>

</html>
