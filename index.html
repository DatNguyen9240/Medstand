<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <link rel="manifest" href="src/pwa/manifest.json">
  <meta name="theme-color" content="#3c50e0">
  <link rel="apple-touch-icon" href="images/logo/medstand-logo.png">
  <title>Medstand</title>

  <!-- ── Core CSS ─────────────────────────────────── -->
  <link rel="stylesheet" href="src/css/design-tokens.css">
  <link rel="stylesheet" href="src/css/global.css">
  <link rel="stylesheet" href="src/css/components/header.css">
  <link rel="stylesheet" href="src/css/components/card.css">
  <link rel="stylesheet" href="src/css/components/nav-bar.css">
  <link rel="stylesheet" href="src/css/components/list.css">
  <link rel="stylesheet" href="src/css/components/chart.css">
  <link rel="stylesheet" href="src/css/components/skeleton.css">
  <link rel="stylesheet" href="src/css/components/loading-spinner.css">
  <link rel="stylesheet" href="src/css/components/search-bar.css">
  <link rel="stylesheet" href="src/css/components/filter.css">
  <link rel="stylesheet" href="src/css/components/total-bar.css">
  <link rel="stylesheet" href="src/css/components/form-select.css">
  <link rel="stylesheet" href="src/css/components/confirm-modal.css">
  <link rel="stylesheet" href="src/css/layouts/desktop.css">

  <!-- ── Theme (must be before body) ─────────────── -->
  <script src="src/js/utils/theme.js"></script>

  <!-- ── Cash.js (jQuery-like) ───────────────────── -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cash/8.1.5/cash.min.js"></script>
</head>

<body>
  <!-- Global Spinner -->
  <div id="global-spinner" class="loading-spinner" hidden aria-live="polite">
    <span class="spinner-dot"></span>
  </div>


  <!-- SPA Content Container (templates provide their own layout wrappers) -->
  <div id="app-content">
    <div style="text-align:center;padding:48px 0;color:var(--color-text-muted)">Đang tải...</div>
  </div>

  <!-- Sidebar + Nav (managed by router) -->
  <div id="sidebar-container"></div>
  <div id="nav-container"></div>

  <!-- ── Shared JS ────────────────────────────────── -->
  <script src="src/js/utils/debounce.js"></script>
  <script src="src/js/components/LoadingSpinner.js"></script>
  <script src="src/js/components/NavBar.js"></script>
  <script src="src/js/components/Alert.js"></script>
  <script src="src/js/components/AuthThemeToggle.js"></script>
  <script src="src/js/components/PasswordToggle.js"></script>

  <!-- API layer -->
  <script src="src/js/config/api.config.js"></script>
  <script src="src/js/config/filter-fields.js"></script>
  <script src="src/js/utils/format.js"></script>
  <script src="src/js/schemas/dashboard.schema.js"></script>
  <script src="src/js/services/http.js"></script>
  <script src="src/js/services/auth.service.js"></script>
  <script src="src/js/services/dashboard.service.js"></script>
  <script src="src/js/services/order.service.js"></script>
  <script src="src/js/services/sales.service.js"></script>
  <script src="src/js/services/other.service.js"></script>

  <!-- Components -->
  <script src="src/js/components/SurveyCheck.js"></script>
  <script src="src/js/components/SearchBar.js"></script>
  <script src="src/js/components/FilterComponent.js"></script>
  <script src="src/js/components/TotalBar.js"></script>
  <script src="src/js/components/FormSelect.js"></script>
  <script src="src/js/components/ConfirmModal.js"></script>
  <script src="src/js/components/Pagination.js"></script>
  <script src="src/js/components/MapPicker.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="src/js/components/Chart.js"></script>

  <!-- Leaflet (for maps) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- SPA Router (must be last) -->
  <script src="src/js/core/router.js"></script>
  <script>
    $(function () {
      Router.init();
    });
  </script>

  <script src="src/pwa/pwa-register.js"></script>
</body>

</html>
