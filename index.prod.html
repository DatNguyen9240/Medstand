<!DOCTYPE html>
<html lang="vi">
<head>
  <!-- Inline Cache-Clearing Script (Bypasses Service Worker traps) -->
  <script>
    if (window.location.href.indexOf('clean=true') > -1) {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function (names) {
          for (var i = 0; i < names.length; i++) {
            caches.delete(names[i]);
          }
        });
      }
      localStorage.removeItem('ai_chat_history');
      var cleanUrl = window.location.href.replace(/[?&]clean=true/g, '').replace(/clean=true/g, '');
      setTimeout(function () { window.location.href = cleanUrl; }, 300);
    }
  </script>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <link rel="manifest" href="src/pwa/manifest.json">
  <meta name="theme-color" content="">
  <link rel="apple-touch-icon" href="images/logo/medstand-logo.png">
  <link rel="shortcut icon" href="images/logo/medstand-logo.png" type="image/png">
  <title>Medstand</title>
  <!-- ── Core CSS ─────────────────────────────────── -->
  <link rel="stylesheet" href="src/css/dist/app.bundle.min.css">
  <!-- ── Theme (must be before body) ─────────────── -->
  <script src="src/js/utils/theme.js"></script>
  <!-- ── Security: DevTools Blocker (F12 Blocker) ── -->
  <script>
    // 1. Kiểm tra xem có chứa tham số bí mật (?dev=true hoặc ?debug=true) trên URL để bypass hay không
    var isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.hostname === '[::1]';
    var isDevBypass = window.location.href.indexOf('dev=true') > -1 || window.location.href.indexOf('debug=true') > -1;
    if (isLocal || isDevBypass) {
      // Nếu là chạy ở local HOẶC có mã bí mật ?dev=true trên URL -> Cho phép F12 bình thường
      console.log('%c🛡️ MEDSTAND SECURITY: DevTools Blocker is BYPASSED (Local or Developer mode).', 'color: #2196f3; font-weight: bold; font-size: 11px;');
    } else {
      // 2. Chặn phím tắt mở F12, Ctrl+Shift+I, Ctrl+U (Xem Source)
      // (Cho phép chuột phải để copy/paste, bẫy debugger bên dưới vẫn sẽ khóa cứng F12 nếu cố tình inspect)
      document.addEventListener('keydown', function (e) {
        if (e.key === 'F12' || 
            (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'C' || e.key === 'J')) || 
            (e.ctrlKey && e.key === 'U')) {
          e.preventDefault();
          return false;
        }
      });
      // 3. Bẫy Debugger vô hiệu hóa DevTools (Làm treo tab khi cố mở F12)
      setInterval(function () {
          try {
              (function () {}).constructor("debugger")();
          } catch (e) {
              debugger;
          }
      }, 100);
    }
  </script>
  <!-- ── Cash.js (jQuery-like) ───────────────────── -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cash/8.1.5/cash.min.js"></script>
</head>
<body>
  <!-- Global Spinner -->
  <div id="global-spinner" class="loading-spinner" hidden aria-live="polite">
    <span class="spinner-dot"></span>
  </div>
  <!-- SPA Content Container (templates provide their own layout wrappers) -->
  <div id="app-content">
    <div style="text-align:center;padding:48px 0;color:var(--color-text-muted)">Đang tải...</div>
  </div>
  <!-- Sidebar + Nav (managed by router) -->
  <div id="sidebar-container"></div>
  <div id="nav-container"></div>
  <!-- Môi trường — SỬA FILE NÀY KHI DEPLOY SANG SERVER MỚI -->
  <!-- ── Shared JS ────────────────────────────────── -->
  <script src="src/js/dist/app.bundle.min.js"></script>
  <!-- API layer -->
  <!-- Components -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Leaflet (for maps) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- SPA Router (must be last) -->
  <script>
    $(function () {
      Router.init();
    });
  </script>
  <!--
    CHATBOT WIDGET V5 — Chỉ load main.js (ES6 module).
    Các script engine cũ (chatbot-api-engine.js, chatbot.js...) vẫn do
    Router.js load đúng lúc khi user navigate vào trang #/chatbot.
    main.js chỉ tạo floating button + Shadow DOM overlay.
  -->
  <script type="module" src="chatbot-widget/js/main.js"></script>
  <script src="src/pwa/pwa-register.js"></script>
</body>
