<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="src/pwa/manifest.json">
    <meta name="theme-color" content="#3c50e0">
    <link rel="apple-touch-icon" href="images/logo/medstand-logo.png">
  <title>Chi tiết đơn hàng - Medstand</title>
  <link rel="stylesheet" href="src/css/design-tokens.css">
  <link rel="stylesheet" href="src/css/global.css">
  <link rel="stylesheet" href="src/css/components/header.css">
  <link rel="stylesheet" href="src/css/components/card.css">
  <link rel="stylesheet" href="src/css/components/nav-bar.css">
  <link rel="stylesheet" href="src/css/components/skeleton.css">
  <link rel="stylesheet" href="src/css/components/loading-spinner.css">
  <link rel="stylesheet" href="src/css/layouts/desktop.css">
  <script src="src/js/utils/theme.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cash/8.1.5/cash.min.js"></script>
  <script src="src/js/components/Alert.js"></script>
  <style>
    .detail-section {
      padding: 0 4px;
      margin-bottom: var(--spacing-md);
    }

    .detail-title {
      font-weight: var(--font-weight-semibold);
      font-size: var(--font-size-lg);
      color: var(--color-primary);
      margin-bottom: var(--spacing-md);
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      font-size: var(--font-size-sm);
      border-bottom: 1px solid var(--color-border);
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-label {
      color: var(--color-text-muted);
      font-weight: var(--font-weight-medium);
    }

    .info-value {
      color: var(--color-text);
      font-weight: var(--font-weight-semibold);
      text-align: right;
      max-width: 60%;
    }

    .section-subtitle {
      font-weight: var(--font-weight-semibold);
      font-size: var(--font-size-md);
      color: var(--color-text);
      margin: var(--spacing-lg) 0 var(--spacing-sm) 0;
    }

    .product-item {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: var(--spacing-md);
      margin-bottom: var(--spacing-sm);
      display: flex;
      gap: var(--spacing-md);
      transition: background-color var(--transition-normal), border-color var(--transition-normal);
    }

    .product-img {
      width: 80px;
      height: 80px;
      border-radius: var(--radius-md);
      object-fit: contain;
      flex-shrink: 0;
      background: rgba(var(--color-primary-rgb), 0.05);
    }

    .product-info {
      flex: 1;
      min-width: 0;
    }

    .product-name {
      font-weight: var(--font-weight-semibold);
      font-size: var(--font-size-sm);
      color: var(--color-text);
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .product-detail-row {
      display: flex;
      justify-content: space-between;
      font-size: var(--font-size-xs);
      color: var(--color-text-secondary);
      margin-bottom: 2px;
    }

    .product-price {
      color: var(--color-primary);
      font-weight: var(--font-weight-semibold);
    }

    .product-points {
      color: var(--color-primary);
      font-weight: var(--font-weight-medium);
    }

    .summary-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: var(--spacing-md);
      margin-top: var(--spacing-md);
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      font-size: var(--font-size-sm);
    }

    .summary-row .label {
      color: var(--color-text-muted);
      font-style: italic;
    }

    .summary-row .value {
      font-weight: var(--font-weight-bold);
      color: var(--color-primary);
    }

    .action-bar {
      display: flex;
      gap: var(--spacing-md);
      padding: var(--spacing-md) 4px;
      margin-bottom: calc(var(--nav-height) + var(--spacing-lg));
    }

    .btn-edit {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: var(--radius-lg);
      background: var(--color-primary);
      color: #fff;
      font-weight: var(--font-weight-semibold);
      font-size: var(--font-size-md);
      cursor: pointer;
      transition: background var(--transition-fast);
    }

    .btn-edit:hover {
      opacity: 0.9;
    }

    .btn-delete {
      flex: 1.5;
      padding: 12px;
      border: none;
      border-radius: var(--radius-lg);
      background: #dc2626;
      color: #fff;
      font-weight: var(--font-weight-semibold);
      font-size: var(--font-size-md);
      cursor: pointer;
      transition: background var(--transition-fast);
    }

    .btn-delete:hover {
      background: #b91c1c;
    }

    /* Skeleton cho detail */
    .skeleton-detail-header {
      height: 80px;
      margin-bottom: var(--spacing-md);
    }

    .skeleton-product {
      height: 100px;
      margin-bottom: var(--spacing-sm);
    }

    .skeleton-summary {
      height: 120px;
      margin-top: var(--spacing-md);
    }
  </style>
</head>

<body data-page="order-detail">
  <header class="app-header" style="justify-content: flex-start; gap: 12px; padding: 0 16px;">
    <a href="order-list.html" style="text-decoration: none; color: var(--color-text-muted); font-size: 1.2rem;">←</a>
    <span style="color: var(--color-primary); font-weight: 600;">Chi tiết đơn hàng</span>
    <div style="margin-left:auto" id="theme-toggle-container"></div>
  </header>

  <main class="app-main">
    <div class="app-content" style="padding-top: var(--spacing-md);">
      <!-- Skeleton -->
      <div id="detail-skeleton">
        <div class="detail-section">
          <div class="skeleton skeleton-detail-header"></div>
          <div class="skeleton skeleton-product"></div>
          <div class="skeleton skeleton-product"></div>
          <div class="skeleton skeleton-summary"></div>
        </div>
      </div>

      <!-- Nội dung thật -->
      <div id="detail-content" hidden>
        <div class="detail-section">
          <div class="detail-title">Chi tiết đơn hàng</div>
          <div id="order-header"></div>
        </div>

        <div class="detail-section">
          <div class="section-subtitle">Thông tin sản phẩm</div>
          <div id="product-list"></div>
        </div>

        <div class="detail-section">
          <div id="order-summary"></div>
        </div>

        <div class="action-bar">
          <button class="btn-edit" id="btn-edit-order">Sửa</button>
          <button class="btn-delete" id="btn-delete-order">Xoá</button>
        </div>
      </div>
    </div>
  </main>

  <div id="sidebar-container"></div>
  <div id="nav-container"></div>
  <script src="src/js/config/api.config.js"></script>
  <script src="src/js/utils/format.js"></script>
  <script src="src/js/services/http.js"></script>
  <script src="src/js/components/SurveyCheck.js"></script>
  <script src="src/js/services/order.service.js"></script>
  <script src="src/js/components/NavBar.js"></script>
    <script src="src/js/pages/order-detail.js"></script>
    <script src="src/pwa/pwa-register.js"></script>
</body>

</html>
