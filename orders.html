<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="src/pwa/manifest.json">
    <meta name="theme-color" content="#3c50e0">
    <link rel="apple-touch-icon" href="images/logo/medstand-logo.png">
  <title>Đơn hàng - Medstand</title>
  <link rel="stylesheet" href="src/css/design-tokens.css">
  <link rel="stylesheet" href="src/css/global.css">
  <link rel="stylesheet" href="src/css/components/header.css">
  <link rel="stylesheet" href="src/css/components/card.css">
  <link rel="stylesheet" href="src/css/components/nav-bar.css">
  <link rel="stylesheet" href="src/css/components/skeleton.css">
  <link rel="stylesheet" href="src/css/components/loading-spinner.css">
  <link rel="stylesheet" href="src/css/layouts/desktop.css">
  <script src="src/js/utils/theme.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cash/8.1.5/cash.min.js"></script>
  <script src="src/js/config/api.config.js"></script>
  <script src="src/js/services/http.js"></script>
  <script src="src/js/components/SurveyCheck.js"></script>
  <style>
    .orders-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--spacing-md);
    }

    @media (min-width: 768px) {
      .orders-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .order-menu-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: var(--spacing-lg);
      text-decoration: none;
      color: var(--color-text);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--spacing-sm);
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast),
        background-color var(--transition-normal);
    }

    .order-menu-card:hover {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 1px rgba(var(--color-primary-rgb), 0.12);
    }

    .order-menu-card.highlighted {
      border-color: var(--color-primary);
      background: rgba(var(--color-primary-rgb), 0.06);
    }

    .order-menu-card.highlighted .menu-icon {
      background: var(--color-primary);
      color: #fff;
    }

    .order-menu-card .menu-icon {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-lg);
      background: rgba(var(--color-primary-rgb), 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }

    .order-menu-card .menu-label {
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-medium);
      text-align: center;
    }
  </style>
</head>

<body data-page="orders">
  <header class="app-header" style="justify-content:center">
    <span style="color:var(--color-primary);font-weight:600;font-size:var(--font-size-lg)">Đơn hàng</span>
    <div style="position:absolute;right:16px" id="theme-toggle-container"></div>
  </header>
  <main class="app-main">
    <div class="app-content">
      <!-- Skeleton -->
      <div id="orders-skeleton" class="orders-grid" aria-busy="true">
        <div class="order-menu-card skeleton" style="height: 100px;"></div>
        <div class="order-menu-card skeleton" style="height: 100px;"></div>
        <div class="order-menu-card skeleton" style="height: 100px;"></div>
        <div class="order-menu-card skeleton" style="height: 100px;"></div>
        <div class="order-menu-card skeleton" style="height: 100px;"></div>
        <div class="order-menu-card skeleton" style="height: 100px;"></div>
      </div>

      <!-- Nội dung thật -->
      <div class="orders-grid" id="orders-grid" hidden></div>
    </div>
  </main>
  <div id="sidebar-container"></div>
  <div id="nav-container"></div>
  <script src="src/js/components/NavBar.js"></script>
  <script src="src/js/services/order.service.js"></script>
    <script src="src/js/pages/orders.js"></script>
    <script src="src/pwa/pwa-register.js"></script>
</body>

</html>
