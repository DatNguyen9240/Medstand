<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Medstand</title>
  <link rel="stylesheet" href="../src/css/design-tokens.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--color-background, #f8fafc);
      color: var(--color-text-secondary, #334155);
      padding: 24px;
    }
    @media (prefers-color-scheme: dark) {
      body { background: var(--color-background, #0f172a); color: var(--color-text, #e2e8f0); }
      .offline-card { background: var(--color-surface, #1e293b); border-color: var(--color-text-secondary, #334155); }
      .btn-retry { background: var(--color-primary, #3b82f6); }
      .btn-retry:hover { background: var(--color-primary-hover, #2563eb); }
    }
    .offline-card {
      text-align: center;
      max-width: 400px;
      width: 100%;
      padding: 48px 32px;
      background: var(--color-surface, #fff);
      border-radius: 16px;
      border: 1px solid var(--color-border, #e2e8f0);
      box-shadow: 0 4px 24px rgba(0,0,0,.06);
    }
    .offline-icon {
      font-size: 4rem;
      margin-bottom: 16px;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 8px;
    }
    p {
      color: var(--color-text-muted, #64748b);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn-retry {
      display: inline-block;
      padding: 12px 32px;
      background: var(--color-primary, #4f46e5);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 150ms ease, transform 150ms ease;
    }
    .btn-retry:hover { background: var(--color-primary-hover, #4338ca); transform: translateY(-1px); }
    .btn-retry:active { transform: translateY(0); }
    .hint {
      margin-top: 20px;
      font-size: 0.8rem;
      color: var(--color-text-muted, #94a3b8);
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="offline-icon">📡</div>
    <h1>Không có kết nối mạng</h1>
    <p>Vui lòng kiểm tra WiFi hoặc dữ liệu di động của bạn rồi thử lại.</p>
    <button class="btn-retry" onclick="location.reload()">Thử lại</button>
    <div class="hint">Các trang đã xem trước đó vẫn có thể truy cập offline</div>
  </div>
  <script>
    // Auto-reload when back online
    window.addEventListener('online', function () {
      location.reload();
    });
  </script>
</body>
</html>
