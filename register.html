<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="src/pwa/manifest.json">
    <meta name="theme-color" content="#3c50e0">
    <link rel="apple-touch-icon" href="images/logo/medstand-logo.png">
  <title>Đăng ký - Medstand</title>
  <link rel="stylesheet" href="src/css/design-tokens.css">
  <script src="src/js/utils/theme.js"></script>
  <script src="src/js/config/api.config.js"></script>
  <script src="src/js/services/http.js"></script>
  <script src="src/js/services/auth.service.js"></script>
  <script src="src/js/components/AuthThemeToggle.js"></script>
  <script src="src/js/components/PasswordToggle.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cash/8.1.5/cash.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: var(--font-family);
      background: var(--color-background);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--spacing-lg) var(--spacing-lg) calc(var(--spacing-lg) + 24px);
      transition: background-color var(--transition-normal);
    }

    .auth-card {
      background: var(--color-surface);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 440px;
      padding: var(--spacing-xl) var(--spacing-lg);
      animation: slideUp .35s ease both;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(24px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Logo */
    .auth-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: var(--spacing-lg);
      gap: 12px;
    }

    .auth-logo-icon {
      width: 64px;
      height: 64px;
      border-radius: var(--radius-lg);
      background: linear-gradient(135deg, var(--color-primary), #6366f1);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(60, 80, 224, .35);
    }

    .auth-logo-icon svg {
      color: #fff;
    }

    .auth-title {
      font-size: var(--font-size-title);
      font-weight: var(--font-weight-bold);
      color: var(--color-text);
    }

    .auth-subtitle {
      font-size: var(--font-size-sm);
      color: var(--color-text-muted);
      margin-top: 2px;
    }

    /* Form */
    .form-group {
      margin-bottom: var(--spacing-md);
    }

    .form-label {
      display: block;
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-medium);
      color: var(--color-text-secondary);
      margin-bottom: 6px;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--color-text-muted);
      pointer-events: none;
      display: flex;
    }

    .form-input {
      width: 100%;
      font-family: var(--font-family);
      font-size: var(--font-size-md);
      color: var(--color-text);
      background: var(--color-background);
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 12px 14px 12px 44px;
      outline: none;
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast),
        background-color var(--transition-normal);
    }

    .form-input:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(var(--color-primary-rgb), .12);
    }

    .form-input.has-toggle {
      padding-right: 44px;
    }

    /* Password strength indicator */
    .pw-strength-bar {
      height: 4px;
      border-radius: 2px;
      background: var(--color-border);
      margin-top: 6px;
      overflow: hidden;
    }

    .pw-strength-fill {
      height: 100%;
      width: 0%;
      border-radius: 2px;
      transition: width .3s, background .3s;
    }

    .pw-strength-label {
      font-size: 0.7rem;
      color: var(--color-text-muted);
      margin-top: 4px;
    }

    /* Inline error */
    .field-error {
      font-size: 0.72rem;
      color: #ef4444;
      margin-top: 4px;
      display: none;
    }

    /* 2 cột */
    .form-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--spacing-sm);
    }

    /* toggle pw */
    .btn-toggle-pw {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--color-text-muted);
      padding: 4px;
      display: flex;
      border-radius: var(--radius-sm);
      transition: color var(--transition-fast);
    }

    .btn-toggle-pw:hover {
      color: var(--color-primary);
    }

    /* Alert tổng */
    .alert-error {
      background: rgba(239, 68, 68, .08);
      border: 1px solid rgba(239, 68, 68, .25);
      color: #ef4444;
      border-radius: var(--radius-md);
      padding: 10px 14px;
      font-size: var(--font-size-sm);
      margin-bottom: var(--spacing-md);
      display: none;
    }

    .alert-success {
      background: rgba(16, 185, 129, .08);
      border: 1px solid rgba(16, 185, 129, .25);
      color: #10b981;
      border-radius: var(--radius-md);
      padding: 10px 14px;
      font-size: var(--font-size-sm);
      margin-bottom: var(--spacing-md);
      display: none;
    }

    /* Terms */
    .terms-wrap {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: var(--spacing-md);
      font-size: var(--font-size-sm);
      color: var(--color-text-muted);
    }

    .terms-wrap input[type=checkbox] {
      accent-color: var(--color-primary);
      width: 16px;
      height: 16px;
      margin-top: 2px;
      flex-shrink: 0;
      cursor: pointer;
    }

    .link {
      color: var(--color-primary);
      text-decoration: none;
      font-weight: var(--font-weight-medium);
    }

    .link:hover {
      text-decoration: underline;
    }

    /* Button */
    .btn-primary {
      width: 100%;
      padding: 14px;
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: var(--radius-md);
      font-family: var(--font-family);
      font-size: var(--font-size-md);
      font-weight: var(--font-weight-semibold);
      cursor: pointer;
      transition: background var(--transition-fast), transform 0.1s, box-shadow var(--transition-fast);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: var(--spacing-md);
    }

    .btn-primary:hover {
      background: var(--color-primary-hover);
      box-shadow: 0 4px 12px rgba(60, 80, 224, .3);
    }

    .btn-primary:active {
      transform: scale(.98);
    }

    .btn-primary:disabled {
      opacity: .6;
      cursor: not-allowed;
      transform: none;
    }

    .btn-spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, .4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: none;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .auth-footer {
      text-align: center;
      font-size: var(--font-size-sm);
      color: var(--color-text-muted);
      margin-top: var(--spacing-sm);
    }

    /* Theme btn */
    .theme-btn {
      position: fixed;
      top: 16px;
      right: 16px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-full);
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--color-text-muted);
      box-shadow: var(--shadow-sm);
      transition: background var(--transition-fast), color var(--transition-fast);
    }

    .theme-btn:hover {
      color: var(--color-primary);
    }

    @media (max-width: 480px) {
      .form-row-2 {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <button class="theme-btn" id="btn-theme" aria-label="Đổi giao diện">
    <svg id="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
    </svg>
    <svg id="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      style="display:none">
      <circle cx="12" cy="12" r="5" />
      <line x1="12" y1="1" x2="12" y2="3" />
      <line x1="12" y1="21" x2="12" y2="23" />
      <line x1="1" y1="12" x2="3" y2="12" />
      <line x1="21" y1="12" x2="23" y2="12" />
    </svg>
  </button>

  <div class="auth-card">
    <div class="auth-logo">
      <img src="images/logo/medstand-logo.png" alt="Medstand Pharma" style="max-width: 200px; height: auto;">
      <div style="text-align:center">
        <div class="auth-subtitle">Tạo tài khoản Medstand của bạn</div>
      </div>
    </div>

    <form id="register-form" novalidate>
      <div id="reg-error" class="alert-error"></div>
      <div id="reg-success" class="alert-success"></div>

      <!-- Họ tên -->
      <div class="form-row-2">
        <div class="form-group">
          <label class="form-label" for="first-name">Họ</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
              </svg>
            </span>
            <input type="text" id="first-name" class="form-input" placeholder="Nguyễn" required>
          </div>
          <div class="field-error" id="err-first-name">Vui lòng nhập họ</div>
        </div>
        <div class="form-group">
          <label class="form-label" for="last-name">Tên</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
              </svg>
            </span>
            <input type="text" id="last-name" class="form-input" placeholder="Văn A" required>
          </div>
          <div class="field-error" id="err-last-name">Vui lòng nhập tên</div>
        </div>
      </div>

      <!-- Username -->
      <div class="form-group">
        <label class="form-label" for="username">Tên đăng nhập</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
          </span>
          <input type="text" id="username" class="form-input" placeholder="username" autocomplete="username" required>
        </div>
        <div class="field-error" id="err-username">Tên đăng nhập phải có ít nhất 4 ký tự</div>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
              <polyline points="22,6 12,13 2,6" />
            </svg>
          </span>
          <input type="email" id="email" class="form-input" placeholder="name@example.com" autocomplete="email"
            required>
        </div>
        <div class="field-error" id="err-email">Email không hợp lệ</div>
      </div>

      <!-- Số điện thoại -->
      <div class="form-group">
        <label class="form-label" for="phone">Số điện thoại</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path
                d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.65 3.44 2 2 0 0 1 3.62 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" />
            </svg>
          </span>
          <input type="tel" id="phone" class="form-input" placeholder="09xxxxxxxx" autocomplete="tel">
        </div>
      </div>

      <!-- Mật khẩu -->
      <div class="form-group">
        <label class="form-label" for="password">Mật khẩu</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
          </span>
          <input type="password" id="password" class="form-input has-toggle" placeholder="Tối thiểu 8 ký tự"
            autocomplete="new-password" required>
          <button type="button" class="btn-toggle-pw" data-target="password" aria-label="Hiện/Ẩn mật khẩu">
            <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <svg class="eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" style="display:none">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
          </button>
        </div>
        <div class="pw-strength-bar">
          <div class="pw-strength-fill" id="pw-fill"></div>
        </div>
        <div class="pw-strength-label" id="pw-label"></div>
        <div class="field-error" id="err-password">Mật khẩu tối thiểu 8 ký tự</div>
      </div>

      <!-- Xác nhận mật khẩu -->
      <div class="form-group">
        <label class="form-label" for="confirm-password">Xác nhận mật khẩu</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 12l2 2 4-4" />
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
          </span>
          <input type="password" id="confirm-password" class="form-input has-toggle" placeholder="Nhập lại mật khẩu"
            autocomplete="new-password" required>
          <button type="button" class="btn-toggle-pw" data-target="confirm-password" aria-label="Hiện/Ẩn mật khẩu">
            <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <svg class="eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" style="display:none">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
          </button>
        </div>
        <div class="field-error" id="err-confirm">Mật khẩu không khớp</div>
      </div>

      <!-- Terms -->
      <label class="terms-wrap">
        <input type="checkbox" id="terms">
        <span>Tôi đồng ý với <a href="#" class="link">Điều khoản sử dụng</a> và <a href="#" class="link">Chính sách bảo
            mật</a></span>
      </label>

      <button type="submit" class="btn-primary" id="btn-register">
        <span class="btn-spinner" id="reg-spinner"></span>
        <span id="btn-reg-text">Đăng ký</span>
      </button>
    </form>

    <div class="auth-footer">
      Đã có tài khoản? <a href="login.html" class="link">Đăng nhập ngay</a>
    </div>
  </div>

  <script>
    AuthThemeToggle.bind();
    PasswordToggle.init();

    // ── Password strength ─────────────────────────────────────────────────────
    document.getElementById('password').addEventListener('input', function () {
      const v = this.value;
      const fill = document.getElementById('pw-fill');
      const label = document.getElementById('pw-label');
      let score = 0;
      if (v.length >= 8) score++;
      if (/[A-Z]/.test(v)) score++;
      if (/[0-9]/.test(v)) score++;
      if (/[^A-Za-z0-9]/.test(v)) score++;

      const levels = [
        { pct: '0%', color: '', text: '' },
        { pct: '25%', color: '#ef4444', text: 'Yếu' },
        { pct: '50%', color: '#f59e0b', text: 'Trung bình' },
        { pct: '75%', color: '#3b82f6', text: 'Khá mạnh' },
        { pct: '100%', color: '#10b981', text: 'Mạnh' },
      ];
      const l = levels[score];
      fill.style.width = v.length ? l.pct : '0%';
      fill.style.background = l.color;
      label.textContent = v.length ? l.text : '';
      label.style.color = l.color;
    });

    // ── Validate helpers ──────────────────────────────────────────────────────
    function showErr(id, show) {
      document.getElementById(id).style.display = show ? 'block' : 'none';
    }

    // ── Register submit ───────────────────────────────────────────────────────
    document.getElementById('register-form').addEventListener('submit', async function (e) {
      e.preventDefault();

      const firstName = document.getElementById('first-name').value.trim();
      const lastName = document.getElementById('last-name').value.trim();
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;
      const confirmPw = document.getElementById('confirm-password').value;
      const terms = document.getElementById('terms').checked;
      const errorEl = document.getElementById('reg-error');
      const successEl = document.getElementById('reg-success');

      // Reset
      errorEl.style.display = 'none';
      successEl.style.display = 'none';
      ['err-first-name', 'err-last-name', 'err-username', 'err-email', 'err-password', 'err-confirm']
        .forEach(id => showErr(id, false));

      // Validate
      let valid = true;
      if (!firstName) { showErr('err-first-name', true); valid = false; }
      if (!lastName) { showErr('err-last-name', true); valid = false; }
      if (username.length < 4) { showErr('err-username', true); valid = false; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showErr('err-email', true); valid = false; }
      if (password.length < 8) { showErr('err-password', true); valid = false; }
      if (password !== confirmPw) { showErr('err-confirm', true); valid = false; }
      if (!terms) {
        errorEl.textContent = 'Bạn cần đồng ý với điều khoản sử dụng.';
        errorEl.style.display = 'block';
        valid = false;
      }
      if (!valid) return;

      // Loading
      const btn = document.getElementById('btn-register');
      const spinner = document.getElementById('reg-spinner');
      const btnText = document.getElementById('btn-reg-text');
      btn.disabled = true;
      spinner.style.display = '';
      btnText.textContent = 'Đang đăng ký...';

      try {
        const displayName = (firstName + ' ' + lastName).trim();
        const res = await Http.post(API_CONFIG.ENDPOINTS.AUTH.REGISTER, {
          UserName: username,
          DisplayName: displayName,
          Password: password
        });
        // SP trả { Msg, MsgType } — MsgType=1 là lỗi, 5 là thành công
        const data = res.data || res;
        const record = Array.isArray(data) ? data[0] : (data.records ? data.records[0] : data);
        const msg = record && record.Msg ? record.Msg : '';
        const msgType = record && record.MsgType !== undefined ? record.MsgType : 5;
        if (msgType == 1) {
          errorEl.textContent = msg || 'Đăng ký thất bại. Vui lòng thử lại.';
          errorEl.style.display = 'block';
          return;
        }
        successEl.textContent = (msg || 'Đăng ký thành công!') + ' Đang chuyển đến trang đăng nhập...';
        successEl.style.display = 'block';
        setTimeout(() => window.location.href = 'login.html', 2000);
      } catch (err) {
        errorEl.textContent = err.message || 'Đăng ký thất bại. Vui lòng thử lại.';
        errorEl.style.display = 'block';
      } finally {
        btn.disabled = false;
        spinner.style.display = 'none';
        btnText.textContent = 'Đăng ký';
      }
    });
  </script>
    <script src="src/pwa/pwa-register.js"></script>
</body>

</html>
