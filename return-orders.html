<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="src/pwa/manifest.json">
    <meta name="theme-color" content="#3c50e0">
    <link rel="apple-touch-icon" href="images/logo/medstand-logo.png">
  <title>Phiếu trả hàng - Medstand</title>
  <link rel="stylesheet" href="src/css/design-tokens.css">
  <link rel="stylesheet" href="src/css/global.css">
  <link rel="stylesheet" href="src/css/components/header.css">
  <link rel="stylesheet" href="src/css/components/card.css">
  <link rel="stylesheet" href="src/css/components/nav-bar.css">
  <link rel="stylesheet" href="src/css/components/skeleton.css">
  <link rel="stylesheet" href="src/css/components/search-bar.css">
  <link rel="stylesheet" href="src/css/components/filter.css">
  <link rel="stylesheet" href="src/css/components/total-bar.css">
  <link rel="stylesheet" href="src/css/layouts/desktop.css">
  <style>
    .return-card {
      background: var(--color-surface);
      border-radius: var(--radius-lg);
      border: 1px solid var(--color-border);
      padding: var(--spacing-md);
      margin-bottom: var(--spacing-md);
      transition: border-color var(--transition-fast), background-color var(--transition-normal);
    }

    .return-card .row {
      display: flex;
      justify-content: space-between;
      margin-bottom: var(--spacing-xs);
      font-size: var(--font-size-sm);
      color: var(--color-text-secondary);
    }

    .return-card .row.main {
      font-weight: var(--font-weight-semibold);
      margin-bottom: var(--spacing-sm);
      color: var(--color-text);
    }

    .return-card .customer {
      color: var(--color-primary);
      font-weight: var(--font-weight-semibold);
      margin: var(--spacing-sm) 0;
      font-size: var(--font-size-sm);
    }

    .return-card .reason {
      font-size: var(--font-size-xs);
      color: var(--color-text-muted);
      font-style: italic;
      margin-bottom: var(--spacing-xs);
    }

    .return-card .amount {
      color: var(--color-primary);
      font-weight: var(--font-weight-semibold);
    }
  </style>
  <script src="src/js/utils/theme.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cash/8.1.5/cash.min.js"></script>
  <script src="src/js/config/api.config.js"></script>
  <script src="src/js/utils/format.js"></script>
  <script src="src/js/services/http.js"></script>
  <script src="src/js/components/SurveyCheck.js"></script>
  <script src="src/js/services/order.service.js"></script>
</head>

<body data-page="return-orders">
  <header class="app-header" style="justify-content: flex-start; gap: 12px; padding: 0 16px;">
    <a href="orders.html" style="text-decoration: none; color: var(--color-text-muted); font-size: 1.2rem;">←</a>
    <span style="color: var(--color-primary); font-weight: 600;">Phiếu trả hàng</span>
    <div style="margin-left:auto" id="theme-toggle-container"></div>
  </header>
  <main class="app-main">
    <div class="app-content">
      <div id="filter-container"></div>
      <div id="return-count" style="font-size:var(--font-size-sm);color:var(--color-text-muted);margin:0 0 var(--spacing-md) 0" hidden></div>
      <div id="skeleton">
        <div class="skeleton skeleton-card" style="margin-bottom:16px"></div>
        <div class="skeleton skeleton-card" style="margin-bottom:16px"></div>
        <div class="skeleton skeleton-card"></div>
      </div>
      <div id="return-list" hidden></div>
    </div>
  </main>
  <div id="sidebar-container"></div>
  <div id="nav-container"></div>
  <script src="src/js/components/NavBar.js"></script>
  <script src="src/js/components/TotalBar.js"></script>
  <script src="src/js/components/FilterComponent.js"></script>
  <script src="src/js/config/filter-fields.js"></script>
    <script src="src/js/pages/return-orders.js"></script>
    <script src="src/pwa/pwa-register.js"></script>
</body>

</html>
