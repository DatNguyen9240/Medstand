<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="src/pwa/manifest.json">
    <meta name="theme-color" content="#3c50e0">
    <link rel="apple-touch-icon" href="images/logo/medstand-logo.png">
  <title>Danh sách sản phẩm - Medstand</title>
  <link rel="stylesheet" href="src/css/design-tokens.css">
  <link rel="stylesheet" href="src/css/global.css">
  <link rel="stylesheet" href="src/css/components/header.css">
  <link rel="stylesheet" href="src/css/components/card.css">
  <link rel="stylesheet" href="src/css/components/nav-bar.css">
  <link rel="stylesheet" href="src/css/layouts/desktop.css">
  <style>
    .product-card {
      background: var(--color-surface);
      border-radius: var(--radius-md);
      border: 1px solid var(--color-border);
      padding: var(--spacing-md);
      margin-bottom: var(--spacing-md);
    }

    .product-card .row {
      display: flex;
      justify-content: space-between;
      margin-bottom: var(--spacing-xs);
      font-size: var(--font-size-sm);
    }

    .product-card .amount {
      color: var(--color-primary);
    }
  </style>
  <script src="src/js/utils/theme.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cash/8.1.5/cash.min.js"></script>
</head>

<body>
  <header class="app-header" style="justify-content: flex-start; gap: 12px;">
    <a href="return-orders.html" style="text-decoration: none; color: var(--color-text-muted);">←</a>
    <span style="color: var(--color-primary); font-weight: 600;">Danh sách sản phẩm</span>
  </header>
  <main class="app-main">
    <div class="app-content">
      <div class="product-card">
        <div class="row"><span>Mã + tên</span><span>DD001 - Paracetamol 500mg</span></div>
        <div class="row"><span>Đơn giá</span><span>45.000</span></div>
        <div class="row"><span>Số lượng</span><span>2</span></div>
        <div class="row"><span>Tổng tiền</span><span class="amount">90.000</span></div>
        <div class="row"><span>Chiết khấu</span><span>0</span></div>
        <div class="row"><span>Thành tiền</span><span class="amount">90.000</span></div>
        <div class="row"><span>Điểm tích lũy</span><span class="amount">9</span></div>
      </div>
    </div>
  </main>
  <div id="sidebar-container"></div>
  <div id="nav-container"></div>
  <script src="src/js/components/NavBar.js"></script>
    <script src="src/js/pages/return-product-list.js"></script>
    <script src="src/pwa/pwa-register.js"></script>
</body>

</html>
