<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="src/pwa/manifest.json">
    <meta name="theme-color" content="#3c50e0">
    <link rel="apple-touch-icon" href="images/logo/medstand-logo.png">
  <title>Tuyến của bạn - Medstand</title>
  <link rel="stylesheet" href="src/css/design-tokens.css">
  <link rel="stylesheet" href="src/css/global.css">
  <link rel="stylesheet" href="src/css/components/header.css">
  <link rel="stylesheet" href="src/css/components/nav-bar.css">
  <link rel="stylesheet" href="src/css/components/skeleton.css">
  <link rel="stylesheet" href="src/css/components/loading-spinner.css">
  <link rel="stylesheet" href="src/css/components/search-bar.css">
  <link rel="stylesheet" href="src/css/components/filter.css">
  <link rel="stylesheet" href="src/css/layouts/desktop.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="src/js/utils/theme.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cash/8.1.5/cash.min.js"></script>
  <script src="src/js/config/api.config.js"></script>
  <script src="src/js/services/http.js"></script>
  <script src="src/js/components/SurveyCheck.js"></script>
  <style>
    .segment {
      display: flex;
      gap: 0;
      margin-bottom: 0;
      border-bottom: 1px solid var(--color-border);
    }

    .segment-item {
      border: none;
      background: none;
      padding: 12px 16px;
      color: var(--color-text-muted);
      cursor: pointer;
      font-family: var(--font-family);
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-medium);
      position: relative;
      transition: color var(--transition-fast);
    }

    .segment-item.active {
      color: var(--color-primary);
      font-weight: var(--font-weight-semibold);
    }

    .segment-item.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--color-primary);
      border-radius: 1px 1px 0 0;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    #map-container {
      width: 100%;
      height: 420px;
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid var(--color-border);
    }

    .location-toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--color-surface);
      color: var(--color-text);
      border: 1px solid var(--color-border);
      padding: 10px 16px;
      border-radius: var(--radius-md);
      font-size: var(--font-size-xs);
      z-index: 1000;
      box-shadow: var(--shadow-lg);
      opacity: 0;
      transition: opacity 0.3s;
      max-width: 90%;
    }
    .location-toast.show {
      opacity: 1;
    }
  </style>
</head>

<body data-page="routes">
  <header class="app-header" style="justify-content:center;gap:8px">
    <a href="index.html"
      style="position:absolute;left:16px;text-decoration:none;color:var(--color-text-muted);font-size:1.2rem">←</a>
    <span style="color:var(--color-primary);font-weight:600">Tuyến của bạn</span>
    <div style="position:absolute;right:16px" id="theme-toggle-container"></div>
  </header>
  <div id="sidebar-container"></div>
  <main class="app-main">
    <div class="app-content">
      <div id="search-container"></div>
      <div class="segment">
        <button class="segment-item active" data-tab="list">Danh sách</button>
        <button class="segment-item" data-tab="map">Bản đồ</button>
      </div>

      <div id="tab-list" class="tab-content active" style="padding-top:16px">
        <p style="text-align:center;color:var(--color-text-muted);padding:48px 0">Không có dữ liệu để hiển thị</p>
      </div>

      <div id="tab-map" class="tab-content" style="padding-top:16px">
        <div id="map-container"></div>
      </div>
      <div id="location-toast" class="location-toast"></div>
    </div>
  </main>
  <div id="nav-container"></div>
  <script src="src/js/components/NavBar.js"></script>
  <script src="src/js/components/FilterComponent.js"></script>
  <script src="src/js/utils/format.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="src/js/pages/routes.js"></script>
    <script src="src/pwa/pwa-register.js"></script>
</body>

</html>
