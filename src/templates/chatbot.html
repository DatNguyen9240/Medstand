<!-- AI Chatbot Page -->
<header class="app-header">
    <button type="button" class="header-icon" id="btn-back" aria-label="Quay lại"
        onclick="history.back()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5"></path>
            <path d="M12 19l-7-7 7-7"></path>
        </svg>
    </button>
    <div class="header-info">
        <p class="header-username" style="font-size:var(--font-size-md)">AI Trợ lý</p>
    </div>
    <button type="button" class="header-icon" id="btn-clear-chat" aria-label="Xóa lịch sử">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
    </button>
</header>

<div class="chat-container" id="chat-container">
    <!-- Welcome message -->
    <div class="chat-welcome" id="chat-welcome">
        <div class="chat-welcome-icon">🤖</div>
        <h3 class="chat-welcome-title">Xin chào!</h3>
        <p class="chat-welcome-text">Tôi là trợ lý AI của bạn. Hãy hỏi tôi bất cứ điều gì!</p>
        <div class="chat-suggestions" id="chat-suggestions">
            <button type="button" class="chat-chip" data-msg="Doanh số tháng này">📊 Doanh số tháng này</button>
            <button type="button" class="chat-chip" data-msg="Top khách hàng mua nhiều nhất">👥 Top khách hàng</button>
            <button type="button" class="chat-chip" data-msg="Đơn hàng chưa giao hôm nay">📦 Đơn chưa giao</button>
            <button type="button" class="chat-chip" data-msg="Sản phẩm bán chạy nhất tuần này">🔥 SP bán chạy</button>
        </div>
    </div>

    <!-- Messages area -->
    <div class="chat-messages" id="chat-messages"></div>
</div>

<!-- Input area -->
<div class="chat-input-bar" id="chat-input-bar">
    <!-- File preview (positioned above input bar via CSS absolute) -->
    <div class="chat-file-preview" id="chat-file-preview" style="display:none">
        <div class="chat-file-preview-info">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
            </svg>
            <span class="chat-file-name" id="chat-file-name"></span>
            <span class="chat-file-size" id="chat-file-size"></span>
        </div>
        <button type="button" class="chat-file-remove" id="chat-file-remove" aria-label="Xóa file">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>
    </div>

    <input type="file" id="chat-file-input" hidden
        accept=".jpg,.jpeg,.png,.gif,.webp,.pdf,.doc,.docx,.xls,.xlsx,.csv,.txt">
    <div class="chat-input-wrap">
        <!-- Attach button -->
        <button type="button" class="chat-action-btn chat-attach-btn" id="btn-attach" aria-label="Đính kèm file">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path
                    d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48">
                </path>
            </svg>
        </button>

        <!-- Mic button -->
        <button type="button" class="chat-action-btn chat-mic-btn" id="btn-mic" aria-label="Ghi âm giọng nói">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <line x1="12" y1="19" x2="12" y2="23"></line>
                <line x1="8" y1="23" x2="16" y2="23"></line>
            </svg>
        </button>

        <textarea class="chat-input" id="chat-input" placeholder="Nhập tin nhắn... (@ tra cứu)" rows="1" autocomplete="off"></textarea>

        <!-- Send button -->
        <button type="button" class="chat-send-btn" id="btn-send" aria-label="Gửi" disabled>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
        </button>
    </div>
</div>
