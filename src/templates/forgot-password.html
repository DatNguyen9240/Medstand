<!-- Theme toggle -->
  <button class="theme-btn" id="btn-theme" aria-label="Đổi giao diện">
    <svg id="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
    </svg>
    <svg id="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      style="display:none">
      <circle cx="12" cy="12" r="5" />
      <line x1="12" y1="1" x2="12" y2="3" />
      <line x1="12" y1="21" x2="12" y2="23" />
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
      <line x1="1" y1="12" x2="3" y2="12" />
      <line x1="21" y1="12" x2="23" y2="12" />
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
    </svg>
  </button>

  <div class="auth-card">
    <!-- Logo -->
    <div class="auth-logo">
      <img src="images/logo/medstand-logo.png" alt="Medstand Pharma" style="max-width: 200px; height: auto;">
      <div>
        <div class="auth-subtitle">Đặt lại mật khẩu tài khoản của bạn</div>
      </div>
    </div>

    <!-- Steps indicator -->
    <div class="steps">
      <div class="step-dot active" id="dot-1"></div>
      <div class="step-dot" id="dot-2"></div>
    </div>

    <div id="form-error" class="alert-error" role="alert"></div>

    <!-- Step 1: Nhập tên đăng nhập -->
    <div id="step-1">
      <div class="form-group">
        <label class="form-label" for="username">Tên đăng nhập</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
          </span>
          <input type="text" id="username" class="form-input" placeholder="Nhập tên đăng nhập" autocomplete="username"
            required>
        </div>
      </div>

      <button type="button" class="btn-primary" id="btn-next">
        <span>Tiếp tục</span>
      </button>
    </div>

    <!-- Step 2: Nhập mật khẩu mới -->
    <div id="step-2" style="display:none">
      <div class="form-group">
        <label class="form-label" for="new-pw">Mật khẩu mới</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
          </span>
          <input type="password" id="new-pw" class="form-input has-toggle" placeholder="Nhập mật khẩu mới"
            autocomplete="new-password">
          <button type="button" class="btn-toggle-pw" data-target="new-pw" aria-label="Hiện/Ẩn mật khẩu">
            <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <svg class="eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" style="display:none">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirm-pw">Xác nhận mật khẩu mới</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
          </span>
          <input type="password" id="confirm-pw" class="form-input has-toggle" placeholder="Nhập lại mật khẩu mới"
            autocomplete="new-password">
          <button type="button" class="btn-toggle-pw" data-target="confirm-pw" aria-label="Hiện/Ẩn mật khẩu">
            <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <svg class="eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" style="display:none">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
          </button>
        </div>
      </div>

      <button type="button" class="btn-primary" id="btn-reset">
        <span class="btn-spinner" id="reset-spinner"></span>
        <span id="btn-reset-text">Đặt lại mật khẩu</span>
      </button>
    </div>

    <div class="auth-footer">
      <a href="#/login" class="link">← Quay lại đăng nhập</a>
    </div>
  </div>
