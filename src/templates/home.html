<!-- Home Template -->
<header class="app-header">
    <img src="https://ui-avatars.com/api/?name=User&background=3c50e0&color=fff" alt="" class="header-avatar"
        width="40" height="40">
    <div class="header-info">
        <p class="header-greeting">Xin chào</p>
        <p class="header-username">Tài khoản test app</p>
    </div>
    <div class="header-actions">
        <span id="theme-toggle-container"></span>
        <button type="button" class="header-icon ai-chat-btn" id="btn-ai-chat" aria-label="AI Chat">
            <svg class="ai-robot" width="28" height="28" viewBox="0 0 48 48" fill="none">
                <defs>
                    <linearGradient id="head-grad" x1="14" y1="12" x2="34" y2="36">
                        <stop offset="0%" stop-color="#6366f1"></stop>
                        <stop offset="100%" stop-color="#3c50e0"></stop>
                    </linearGradient>
                    <radialGradient id="eye-glow" cx="50%" cy="40%" r="50%">
                        <stop offset="0%" stop-color="#fff"></stop>
                        <stop offset="100%" stop-color="#c7d2fe"></stop>
                    </radialGradient>
                </defs>
                <!-- Antenna -->
                <line x1="24" y1="5" x2="24" y2="12" stroke="#6366f1" stroke-width="2" stroke-linecap="round"></line>
                <circle cx="24" cy="4" r="3" fill="#818cf8">
                    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"></animate>
                </circle>
                <!-- Ears -->
                <rect x="6" y="20" width="5" height="8" rx="2.5" fill="#6366f1" opacity="0.5"></rect>
                <rect x="37" y="20" width="5" height="8" rx="2.5" fill="#6366f1" opacity="0.5"></rect>
                <!-- Head -->
                <rect x="10" y="12" width="28" height="24" rx="7" fill="url(#head-grad)"></rect>
                <!-- Face plate -->
                <rect x="14" y="16" width="20" height="16" rx="5" fill="#eef2ff" opacity="0.95"></rect>
                <!-- Eyes -->
                <ellipse cx="19.5" cy="23" rx="3" ry="3.2" fill="url(#eye-glow)"></ellipse>
                <circle cx="19.5" cy="23.5" r="1.8" fill="#3c50e0"></circle>
                <circle cx="18.8" cy="22.5" r="0.7" fill="#fff"></circle>
                <ellipse cx="28.5" cy="23" rx="3" ry="3.2" fill="url(#eye-glow)"></ellipse>
                <circle cx="28.5" cy="23.5" r="1.8" fill="#3c50e0"></circle>
                <circle cx="27.8" cy="22.5" r="0.7" fill="#fff"></circle>
                <!-- Cheeks -->
                <circle cx="16" cy="27" r="2" fill="#f9a8d4" opacity="0.5"></circle>
                <circle cx="32" cy="27" r="2" fill="#f9a8d4" opacity="0.5"></circle>
                <!-- Mouth -->
                <path d="M21 29 Q24 32.5 27 29" stroke="#3c50e0" stroke-width="1.5" fill="none" stroke-linecap="round"></path>
                <!-- Waving arm -->
                <g class="ai-hand" transform-origin="40 30">
                    <path d="M38 28 Q42 22 44 18" stroke="#6366f1" stroke-width="2.5" fill="none" stroke-linecap="round"></path>
                    <circle cx="44" cy="16" r="3.5" fill="#818cf8"></circle>
                    <!-- Fingers -->
                    <line x1="42" y1="14" x2="41" y2="11" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round"></line>
                    <line x1="44" y1="13" x2="44" y2="10" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round"></line>
                    <line x1="46" y1="14" x2="47" y2="11" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round"></line>
                </g>
            </svg>
        </button>
        <div class="header-notification">
            <button type="button" class="header-icon" aria-label="Thông báo" id="btn-notif">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
                <span class="notification-badge" id="notif-badge" hidden>0</span>
            </button>
        </div>
    </div>
</header>

<div class="app-content">
    <div class="top-row">
        <div id="stats-container">
            <div class="stats-row" id="stats-skeleton" aria-busy="true">
                <div class="stat-card skeleton">
                    <div class="skeleton-text"></div>
                    <div class="skeleton-text" style="width:50%"></div>
                </div>
                <div class="stat-card skeleton">
                    <div class="skeleton-text"></div>
                    <div class="skeleton-text" style="width:50%"></div>
                </div>
                <div class="stat-card skeleton">
                    <div class="skeleton-text"></div>
                    <div class="skeleton-text" style="width:50%"></div>
                </div>
            </div>
            <div class="stats-row" id="stats-content" hidden aria-busy="false"></div>
        </div>

        <div class="revenue-section">
            <div class="revenue-top-row">
                <p class="revenue-title">Doanh số tháng</p>
                <p class="revenue-value" id="revenue-value" hidden>—</p>
                <div class="skeleton skeleton-text" id="revenue-skeleton"
                    style="width:140px;height:28px;border-radius:6px"></div>
            </div>
            <div class="revenue-date-row">
                <input type="date" id="chart-date-from" class="date-input form-control" aria-label="Từ ngày">
                <span class="revenue-arrow">→</span>
                <input type="date" id="chart-date-to" class="date-input form-control" aria-label="Đến ngày">
            </div>
        </div>
    </div>

    <div class="chart-section">
        <div class="chart-header">
            <div class="chart-header-left">
                <h3 class="chart-title">Biểu đồ doanh số</h3>
                <p class="chart-subtitle">Theo ngày trong kỳ</p>
            </div>
        </div>
        <div id="chart-skeleton" class="skeleton skeleton-chart"></div>
        <div class="chart-wrapper">
            <canvas id="revenue-chart" style="display:none"></canvas>
        </div>
    </div>

    <div class="section-header">
        <span class="section-line"></span>
        <h3 class="section-title">Sinh nhật</h3>
        <span class="section-badge" id="birthday-count" hidden>🎁 0</span>
    </div>

    <div id="birthdays-container">
        <ul class="list" id="birthdays-skeleton">
            <li class="skeleton-list-item">
                <div class="skeleton skeleton-avatar"></div>
                <div class="skeleton" style="flex:1;height:2em"></div>
            </li>
            <li class="skeleton-list-item">
                <div class="skeleton skeleton-avatar"></div>
                <div class="skeleton" style="flex:1;height:2em"></div>
            </li>
            <li class="skeleton-list-item">
                <div class="skeleton skeleton-avatar"></div>
                <div class="skeleton" style="flex:1;height:2em"></div>
            </li>
        </ul>
        <ul class="list" id="birthdays-list" hidden></ul>
    </div>
</div>
