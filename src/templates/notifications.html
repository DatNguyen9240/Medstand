<!-- Notifications Page -->
<header class="app-header">
    <button type="button" class="header-icon" id="btn-back" aria-label="Quay lại" onclick="history.back()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19 12H5"></path>
            <path d="M12 19l-7-7 7-7"></path>
        </svg>
    </button>
    <div class="header-info">
        <p class="header-username notif-header-title">Thông báo</p>
    </div>
</header>

<main class="app-content notif-page">
    <div class="notif-toolbar">
        <label class="notif-unread-filter">
            <input type="checkbox" id="notif-unread-only">
            <span>Chỉ chưa đọc</span>
        </label>
        <p class="notif-live-status" id="notif-status" role="status" aria-live="polite"></p>
    </div>

    <ul class="notif-page-list" id="notif-skeleton" aria-hidden="true">
        <li class="notif-page-item skeleton-notif">
            <div class="skeleton skeleton-avatar notif-skeleton-dot"></div>
            <div class="notif-skeleton-lines">
                <div class="skeleton notif-skeleton-title"></div>
                <div class="skeleton notif-skeleton-text"></div>
            </div>
        </li>
        <li class="notif-page-item skeleton-notif">
            <div class="skeleton skeleton-avatar notif-skeleton-dot"></div>
            <div class="notif-skeleton-lines">
                <div class="skeleton notif-skeleton-title"></div>
                <div class="skeleton notif-skeleton-text"></div>
            </div>
        </li>
    </ul>

    <ul class="notif-page-list" id="notif-list" hidden></ul>

    <div class="notif-empty" id="notif-empty" hidden>
        <svg class="notif-empty-icon" width="42" height="42" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <p class="notif-empty-text">Không có thông báo</p>
    </div>

    <div class="notif-empty" id="notif-error" hidden>
        <p class="notif-empty-text">Không thể tải thông báo.</p>
        <button type="button" class="btn btn-outline" id="notif-retry">Thử lại</button>
    </div>

    <nav class="notif-pagination" aria-label="Phân trang thông báo">
        <button type="button" class="header-icon" id="notif-prev" aria-label="Trang trước" disabled>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
        </button>
        <span id="notif-page-label">Trang 1/1</span>
        <button type="button" class="header-icon" id="notif-next" aria-label="Trang sau" disabled>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
        </button>
    </nav>
</main>

<div class="notif-detail-modal" id="notif-detail-modal" role="dialog" aria-modal="true"
    aria-labelledby="notif-detail-title" hidden>
    <article class="notif-detail-panel">
        <header class="notif-detail-header">
            <div>
                <h2 id="notif-detail-title">Thông báo</h2>
                <p id="notif-detail-meta"></p>
            </div>
            <button type="button" class="header-icon" id="notif-detail-close" aria-label="Đóng">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
            </button>
        </header>
        <div class="notif-detail-body" id="notif-detail-body"></div>
    </article>
</div>
