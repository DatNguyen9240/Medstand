<header class="app-header" style="justify-content: flex-start; gap: 12px; padding: 0 16px;">
    <a href="#/orders" style="text-decoration: none; color: var(--color-text-muted); font-size: 1.2rem;">←</a>
    <span style="color: var(--color-primary); font-weight: 600;">Danh sách đơn hàng</span>
    <div style="margin-left:auto" id="theme-toggle-container"></div>
  </header>

  <main class="app-main">
    <div class="app-content">
      <div id="filter-container"></div>

      <div id="order-skeleton">
        <div class="skeleton skeleton-card" style="margin-bottom: var(--spacing-md);"></div>
        <div class="skeleton skeleton-card" style="margin-bottom: var(--spacing-md);"></div>
        <div class="skeleton skeleton-card" style="margin-bottom: var(--spacing-md);"></div>
        <div class="skeleton skeleton-card" style="margin-bottom: var(--spacing-md);"></div>
        <div class="skeleton skeleton-card"></div>
      </div>

      <div id="order-list" hidden></div>
    </div>
  </main>

  <button type="button" class="fab" aria-label="Tạo đơn mới"
    onclick="window.location.href='#/create-order'">+</button>
