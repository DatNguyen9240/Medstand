<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="src/pwa/manifest.json">
    <meta name="theme-color" content="#3c50e0">
    <link rel="apple-touch-icon" href="images/logo/medstand-logo.png">
  <title>Làm khảo sát - Medstand</title>
  <link rel="stylesheet" href="src/css/design-tokens.css">
  <link rel="stylesheet" href="src/css/global.css">
  <link rel="stylesheet" href="src/css/components/header.css">
  <link rel="stylesheet" href="src/css/components/card.css">
  <link rel="stylesheet" href="src/css/components/nav-bar.css">
  <link rel="stylesheet" href="src/css/layouts/desktop.css">
  <style>
    .survey-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 0 8px 0;
    }

    .survey-header .back-btn {
      font-size: 1.25rem;
      color: var(--color-primary);
      text-decoration: none;
    }

    .survey-header .title {
      font-weight: 600;
      color: var(--color-primary);
      font-size: 1.125rem;
    }

    .survey-content {
      display: flex;
      flex-direction: column;
      gap: 24px;
      padding: 16px 0;
    }

    .question-card {
      background: var(--color-surface);
      border-radius: 16px;
      border: 1px solid var(--color-border);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .question-title {
      font-weight: 600;
      font-size: 1rem;
      color: var(--color-text);
    }

    .answer-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .answer-item {
      background: var(--color-background);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 1rem;
      color: var(--color-text);
      cursor: pointer;
      border: 1.5px solid transparent;
      transition: border .2s;
    }

    .answer-item.selected {
      border-color: var(--color-primary);
      background: rgba(var(--color-primary-rgb), 0.1);
      color: var(--color-primary);
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: 16px;
      font-weight: 600;
      font-size: 1rem;
      margin-top: 24px;
      cursor: pointer;
    }

    @media (min-width:768px) {
      .app-content {
        max-width: 420px;
        margin: auto;
      }
    }
  </style>
  <script src="src/js/utils/theme.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cash/8.1.5/cash.min.js"></script>
  <script src="src/js/components/Alert.js"></script>
</head>

<body data-page="survey-question">
  <header class="app-header">
    <div class="survey-header">
      <a href="survey.html" class="back-btn" aria-label="Quay lại">←</a>
      <span class="title">Làm khảo sát</span>
    </div>
  </header>
  <main class="app-main">
    <div class="app-content">
      <div class="survey-content">
        <div class="question-card">
          <div class="question-title">Câu hỏi 1: Bạn đánh giá chất lượng dịch vụ như thế nào?</div>
          <div class="answer-list">
            <div class="answer-item" onclick="selectAnswer(this)">Rất tốt</div>
            <div class="answer-item" onclick="selectAnswer(this)">Tốt</div>
            <div class="answer-item" onclick="selectAnswer(this)">Bình thường</div>
            <div class="answer-item" onclick="selectAnswer(this)">Kém</div>
          </div>
        </div>
        <div class="question-card">
          <div class="question-title">Câu hỏi 2: Bạn có giới thiệu nhà thuốc cho người khác không?</div>
          <div class="answer-list">
            <div class="answer-item" onclick="selectAnswer(this)">Có</div>
            <div class="answer-item" onclick="selectAnswer(this)">Không</div>
          </div>
        </div>
        <button class="btn-submit" onclick="Alert.success('Đã gửi khảo sát!')">Gửi khảo sát</button>
      </div>
    </div>
  </main>
  <div id="sidebar-container"></div>
  <div id="nav-container"></div>
  <script src="src/js/components/NavBar.js"></script>
    <script src="src/js/pages/survey-question.js"></script>
    <script src="src/pwa/pwa-register.js"></script>
</body>

</html>
