<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Memory Emulator • Multi-Turn State</title>
    <link rel="stylesheet" href="theme.css">
    <script src="../../env.js"></script>
    <style>
        :root {
            --bg-color: var(--md-bg-base);
            --panel-bg: var(--md-bg-card);
            --card-bg: var(--md-bg-card-hover);
            --border-color: var(--md-border);
            --text-color: var(--md-text-main);
            --accent: var(--md-accent);
            --accent-glow: var(--md-accent-glow);
            --success: var(--md-success);
            --warning: var(--md-warning);
            --danger: var(--md-danger);
            --user-bubble: #1f2937;
            --ai-bubble: rgba(168, 85, 247, 0.15); /* Purple bubble */
        }

        * { box-sizing: border-box; font-family: inherit; }
        
        body {
            margin: 0; padding: 20px;
        }

        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { margin: 0 0 10px 0; font-weight: 300; letter-spacing: 1px; color: #fff; }
        .header p { color: #8ba3b8; font-size: 14px; margin: 0; }

        .container {
            max-width: 1200px; /* same as test-runner */
            margin: 0 auto;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--md-bg-card);
            border: 1px solid var(--md-border);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
            text-align: center;
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            background: var(--md-bg-card-hover);
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-label {
            color: var(--md-text-muted);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .text-success { color: var(--md-success); }
        .text-danger { color: var(--md-danger); }
        .text-accent { color: var(--md-accent); }

        .control-panel {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        button {
            font-family: inherit; font-weight: 600; padding: 12px 24px; border-radius: 8px;
            border: none; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 1rem; display: flex; align-items: center; gap: 8px;
        }

        .btn-run {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }
        .btn-run:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4); }

        .btn-stop {
            background: rgba(239, 68, 68, 0.1); color: var(--md-danger); border: 1px solid var(--md-danger);
        }
        .btn-stop:hover:not(:disabled) { background: var(--md-danger); color: white; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3); }

        .btn-export {
            background: rgba(168, 85, 247, 0.1); color: var(--md-intent-color); border: 1px solid var(--md-intent-color);
        }
        .btn-export:hover:not(:disabled) { background: var(--md-intent-color); color: white; box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3); }
        
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

        .session-card {
            background: var(--md-bg-card);
            border: 1px solid var(--md-border);
            border-radius: 12px;
            margin-bottom: 24px;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .session-header {
            padding: 16px 24px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid var(--md-border);
        }
        
        .session-title {
            font-size: 1.15rem;
            font-weight: 600;
        }

        .chat-turn {
            padding: 15px;
            border-bottom: 1px dashed rgba(255,255,255,0.05);
        }
        .chat-turn:last-child { border-bottom: none; }

        .meta-info { font-size: 12px; color: #6b7280; margin-bottom: 8px; }
        .token-history { background: #111; color: #a5b4fc; padding: 6px; border-radius: 4px; font-family: monospace; font-size: 11px; margin-bottom: 8px; white-space: pre-wrap;}

        .bubble { padding: 10px 14px; border-radius: 8px; margin-bottom: 10px; max-width: 80%; font-size: 13px; line-height: 1.5; }
        .bubble.user { background: var(--user-bubble); margin-left: auto; border-bottom-right-radius: 0; color: #fff; }
        .bubble.ai { background: var(--ai-bubble); border-bottom-left-radius: 0; border: 1px solid rgba(59,130,246,0.3); color: #e2e8f0; }

        .expectation {
            background: rgba(16, 185, 129, 0.05);
            border-left: 3px solid var(--success);
            padding: 8px 12px; font-size: 12px;
            margin-top: 10px; border-radius: 0 4px 4px 0;
        }

        .status-badge {
            padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: bold;
        }
        .pass { background: rgba(16,185,129,0.2); color: #34d399; border: 1px solid rgba(16,185,129,0.3); }
        .fail { background: rgba(239,68,68,0.2); color: #f87171; border: 1px solid rgba(239,68,68,0.3); }
        .wait { background: rgba(156,163,175,0.2); color: #9ca3af; }

    </style>
</head>
<body class="medstand-theme">

<div class="container">
    <div class="md-header">
        <h1>Multi-Turn Memory Emulator 🧠</h1>
        <p>Simulating Context-Aware AI Stateless Interactions across Sequential Contexts</p>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-value text-accent" id="lblTotal">0</div>
            <div class="stat-label">Tổng Session</div>
        </div>
        <div class="stat-card">
            <div class="stat-value text-success" id="lblPass">0</div>
            <div class="stat-label">Passed</div>
        </div>
        <div class="stat-card">
            <div class="stat-value text-danger" id="lblFail">0</div>
            <div class="stat-label">Failed</div>
        </div>
    </div>

    <div class="control-panel">
        <button class="btn-run" id="btnRun" onclick="runAllSessions()">▶ RUN EMULATOR</button>
        <button class="btn-stop" id="btnStop" onclick="stopAllSessions()" disabled>⏹ STOP</button>
        <button class="btn-export" id="btnExport" onclick="exportReport()">📥 EXPORT REPORT</button>
    </div>
    
    <div id="results"></div>
</div>

<script>
    const N8N_URL = window.API_CONFIG?.N8N_BASE;
    if(!N8N_URL) throw new Error("CRITICAL: Không tìm thấy N8N_BASE. Vui lòng kiểm tra file env.js!");
    const WEBHOOK_URL = N8N_URL + (window.API_CONFIG?.CHAT_WEBHOOK || "/webhook/hook-ai-dainao");

    const SESSIONS = [
        {
            id: "S1",
            name: "Session 1: Bổ sung Context Thuần Tuý",
            turns: [
                { role: "user", text: "Xem công nợ chi tiết đi", expectIntent: "ASK_CLARIFICATION" },
                { role: "ai", text: "Bạn muốn xem chi tiết công nợ của khách hàng hay đại lý nào ạ?" },
                { role: "user", text: "Khách Mã HB106", expectIntent: "@cong_no_chi_tiet", paramCheck: { "@khachhang": "HB106" } }
            ]
        },
        {
            id: "S2",
            name: "Session 2: Thay đổi Ý định (Pivoting)",
            turns: [
                { role: "user", text: "khách vip HKDPD mua hàng trễ quá", expectIntent: "@tuyen_ban_hang" },
                { role: "ai", text: "Khách HKDPD thuộc tuyến đang bị rớt..." },
                { role: "user", text: "vậy năm nay nó công nợ bao nhiêu", expectIntent: "@cong_no_khach_hang", paramCheck: { "@khachhang": "HKDPD" } }
            ]
        },
        {
            id: "S3",
            name: "Session 3: Hỏi gộp chủ ngữ",
            turns: [
                { role: "user", text: "Dạo này Nguyễn Duy Minh đi làm siêng ghê", expectIntent: "ASK_CLARIFICATION" },
                { role: "ai", text: "Vâng, bạn cần kiểm tra doanh số hay thông tin gì của nhân viên này?" },
                { role: "user", text: "xem doanh thu tháng 3 của nó", expectIntent: "@doanh_so", paramCheck: { "@EmployeeName": "MINH" } }
            ]
        },
        {
            id: "S4",
            name: "Session 4: Bẻ lái khét lẹt (Drift Inception)",
            turns: [
                { role: "user", text: "xem lịch sử đặt hàng của khách HB106", expectIntent: "@don_hang", paramCheck: { "@khachhang": "HB106" } },
                { role: "ai", text: "Đây là danh sách đơn hàng của khách hàng này..." },
                { role: "user", text: "hôm nay gợi ý bán gì cho người này được", expectIntent: "@goi_ydon_hang", paramCheck: { "@khachhang": "HB106" } },
                { role: "ai", text: "Gợi ý các mặt hàng nên bán hôm nay..." },
                { role: "user", text: "mua nhiều vậy thì đã lên hạng chưa", expectIntent: "@cham_diem_kh", paramCheck: { "@khachhang": "HB106" } }
            ]
        }
    ];

    const $results = document.getElementById("results");
    
    let globalReport = { metadata: { type: "Memory_State_Emulator", timestamp: "" }, summary: { total: 0, pass: 0, fail: 0 }, details: [] };

    function exportReport() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(globalReport, null, 2));
        const a = document.createElement('a');
        a.href = dataStr;
        a.download = "memory_state_report_" + Date.now() + ".json";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }

    function renderUI() {
        let totalSess = SESSIONS.length;
        document.getElementById('lblTotal').innerText = totalSess;
        document.getElementById('lblPass').innerText = "0";
        document.getElementById('lblFail').innerText = "0";

        let html = '';
        SESSIONS.forEach(sess => {
            html += `<div class="session-card" id="card-${sess.id}">
                <div class="session-header">
                    <span class="session-title">${sess.name}</span>
                    <span class="status-badge wait" id="status-${sess.id}" style="padding: 6px 12px; font-size: 0.85rem; border-radius: 6px; background: rgba(255,255,255,0.05);">WAITING</span>
                </div>
                <div class="session-body">`;
            
            sess.turns.forEach((turn, idx) => {
                let badge = turn.role === 'user' ? `<span style="float:right; font-size:10px; opacity:0.5" id="t-status-${sess.id}-${idx}">⏳</span>` : '';
                html += `<div class="chat-turn">
                    <div class="bubble ${turn.role}"><b>${turn.role.toUpperCase()}</b>: ${turn.text} ${badge}</div>
                    <div id="meta-${sess.id}-${idx}"></div>
                </div>`;
            });

            html += `</div></div>`;
        });
        $results.innerHTML = html;
    }

    async function evaluateTurn(sess, turnIdx, simulatedHistory) {
        let turn = sess.turns[turnIdx];
        
        let histStr = simulatedHistory.map(m => `${m.role === 'user' ? 'User:' : 'AI:'} ${m.text}`).join('\n');
        
        let payload = {
            action: 'chat',
            text: turn.text,
            session_id: 'test_memory_' + sess.id,
            history: histStr
        };

        const t0 = performance.now();
        try {
            let res = await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            let data = await res.json();
            let timeMs = Math.round(performance.now() - t0);

            // Xác định Intent / ApiCode
            let actualIntent = data.action_code || data.apiCode || "UNKNOWN";
            let actualParams = data.intentParams || {};

            let isPass = (actualIntent === turn.expectIntent);
            
            // Check cross-role params if required
            if (isPass && turn.paramCheck) {
                for (let k in turn.paramCheck) {
                    let expectedVal = turn.paramCheck[k].toUpperCase();
                    let actualVal = String(actualParams[k] || '').toUpperCase();
                    if (!actualVal.includes(expectedVal)) {
                        isPass = false;
                        actualIntent += ` (Lỗi Param: Thiếu ${expectedVal})`;
                    }
                }
            }

            globalReport.details.push({
                session: sess.name,
                turnText: turn.text,
                payloadHistory: histStr,
                expectedIntent: turn.expectIntent,
                actualIntent: actualIntent,
                isPass: isPass,
                timeMs: timeMs
            });

            let div = document.getElementById(`meta-${sess.id}-${turnIdx}`);
            let icon = document.getElementById(`t-status-${sess.id}-${turnIdx}`);
            
            icon.innerHTML = isPass ? "✅" : "❌";
            
            let aiDebugBtnHtml = '';
            if (!isPass) {
                // escape strings safely for onclick
                let t_turn = turn.text.replace(/'/g, "\\'").replace(/\n/g, "\\n");
                let t_hist = histStr.replace(/'/g, "\\'").replace(/\n/g, "\\n");
                let t_exp = turn.expectIntent.replace(/'/g, "\\'");
                let t_act = actualIntent.replace(/'/g, "\\'");
                aiDebugBtnHtml = `
                    <div style="margin-top: 8px;">
                        <button onclick="aiDebugTurn(this, '${sess.id}', ${turnIdx}, '${t_turn}', '${t_hist}', '${t_exp}', '${t_act}')" style="background:#8b5cf6; color:#fff; border:none; padding:5px 10px; border-radius:4px; font-size:11px; cursor:pointer;" id="debug-btn-${sess.id}-${turnIdx}">🤖 AI Debug Lỗi</button>
                    </div>
                `;
            }

            div.innerHTML = `
                <div class="token-history"><b>📦 Payload History:</b>\n${histStr || '(Empty Box)'}</div>
                <div class="expectation">
                    <b>Trích xuất:</b> ${actualIntent} <br>
                    <b>Kỳ vọng:</b> ${turn.expectIntent} <br>
                    <b>Thời gian truy xuất:</b> ${timeMs}ms (Siêu Tốc)
                </div>
                ${aiDebugBtnHtml}
                <div id="ai-insight-${sess.id}-${turnIdx}" style="display:none; margin-top:8px; padding:10px; background:rgba(139, 92, 246, 0.1); border-left:3px solid #a855f7; border-radius:4px; font-size:13px; color:#ddd; line-height:1.5;"></div>
            `;

            return isPass;

        } catch (err) {
            document.getElementById(`t-status-${sess.id}-${turnIdx}`).innerHTML = "💥";
            return false;
        }
    }

        let isCancelled = false;
        let passCount = 0;
        let failCount = 0;

        function renderResults(res) {
            let logHtml = `<div style="margin-top: 10px; font-family: monospace; font-size: 13px;">`;
            if (res.error) {
                logHtml += `<span style="color:var(--md-danger)">❌ API Error: ${res.error}</span>`;
            } else {
                logHtml += `✅ <span style="color:#22c55e">Resolved Intent:</span> <b style="color:var(--md-intent-color)">${res.apiCode||res.action_code||'Unknown'}</b>\n`;
                if(res.missing_fields && res.missing_fields.length > 0) {
                    logHtml += `\n⚠️ <span style="color:#eab308">Missing Fields:</span> ${res.missing_fields.join(", ")}`;
                } else if (res.AI_Params) {
                    logHtml += `\n📝 <span style="color:#3b82f6">Extracted Params:</span> ${JSON.stringify(res.AI_Params)}`;
                } else if (res.table || res.data) {
                    logHtml += `\n📊 <span style="color:#0ea5e9">Data Retrieved:</span> ${Array.isArray(res.table) ? res.table.length : (Array.isArray(res.data) ? res.data.length : 0)} rows`;
                }
            }
            logHtml += `</div>`;
            return logHtml;
        }

        function stopAllSessions() {
            isCancelled = true;
            document.getElementById('btnStop').disabled = true;
            document.getElementById('btnRun').disabled = false;
        }

        async function runSession(sess) {
            let sessHasError = false;
            let histBlock = [];
            let card = document.getElementById(`card-${sess.id}`);

            for (let i = 0; i < sess.turns.length; i++) {
                if (isCancelled) return;
                let turn = sess.turns[i];
                if (turn.role === 'user') {
                    globalReport.summary.total++;
                    let pass = await evaluateTurn(sess, i, histBlock);
                    if(!pass) {
                        sessHasError = true;
                    }
                }
                histBlock.push(turn);
            }

            let badge = document.getElementById(`status-${sess.id}`);
             if (sessHasError) {
                card.style.borderColor = 'rgba(239, 68, 68, 0.5)';
                badge.className = 'status-badge fail';
                badge.style.background = 'rgba(239, 68, 68, 0.15)';
                badge.style.border = '1px solid var(--md-danger)';
                badge.style.color = 'var(--md-danger)';
                badge.innerText = 'FAIL';
                failCount++;
            } else {
                card.style.borderColor = 'rgba(16, 185, 129, 0.5)';
                badge.className = 'status-badge pass';
                badge.style.background = 'rgba(16, 185, 129, 0.15)';
                badge.style.border = '1px solid var(--md-success)';
                badge.style.color = 'var(--md-success)';
                badge.innerText = 'PASS';
                passCount++;
            }
            
            document.getElementById('lblPass').innerText = passCount;
            document.getElementById('lblFail').innerText = failCount;
        }

        async function runAllSessions() {
            isCancelled = false;
            passCount = 0; failCount = 0;
            document.getElementById('lblPass').innerText = "0";
            document.getElementById('lblFail').innerText = "0";

            let btnRun = document.getElementById('btnRun');
            let btnStop = document.getElementById('btnStop');
            btnRun.disabled = true;
            btnStop.disabled = false;
            btnRun.innerText = "⏳ RUNNING...";
            
            document.querySelectorAll('.status-badge').forEach(el => {
                el.className = 'status-badge wait';
                el.innerText = 'WAITING';
                el.style = "padding: 6px 12px; font-size: 0.85rem; border-radius: 6px; background: rgba(255,255,255,0.05); color: var(--md-text-muted);";
            });
            document.querySelectorAll('.session-card').forEach(el => {
                el.style.borderColor = 'var(--md-border)';
            });

            for (let sess of SESSIONS) {
                if (isCancelled) break;
                await runSession(sess);
                await new Promise(r => setTimeout(r, 1000)); // Sleep between sessions
            }

            btnRun.disabled = false;
            btnStop.disabled = true;
            btnRun.innerText = "▶ RUN EMULATOR";
            document.getElementById('btnExport').style.display = 'inline-block';
        };

    async function aiDebugTurn(btn, sessId, turnIdx, turnText, hist, exp, act) {
        btn.disabled = true;
        let oldText = btn.innerText;
        btn.innerText = "🤖 Đang phân tích, đợi 1 xíu...";
        let insightDiv = document.getElementById(`ai-insight-${sessId}-${turnIdx}`);
        insightDiv.style.display = "block";
        insightDiv.innerHTML = "<i style='color:#a855f7'>Bác sĩ AI đang đọc lịch sử và khám não module N8N...</i>";
        
        try {
            let res = await fetch(N8N_URL + "/webhook/hook-ai-reviewer", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ turnText: turnText, payloadHistory: hist, expectedIntent: exp, actualIntent: act })
            });
            let data = await res.json();
            let htmlInsight = data.insight ? data.insight.replace(/\n/g, '<br>') : "Chưa bóc được lỗi, có thể do token limit.";
            insightDiv.innerHTML = "<b style='color:#d8b4fe'>💡 AI EXPERT INSIGHT:</b><br><div style='margin-top:5px;'>" + htmlInsight + "</div>";
            btn.style.display = 'none';
        } catch (e) {
            insightDiv.innerHTML = "<b style='color:#ef4444'>❌ Bác sĩ bận hoặc mất kết nối:</b> " + e.message + "<br><small>(Chú ý: Phải đảm bảo đang BẬT Active Workflow K_AI_Reviewer trong N8N!)</small>";
            btn.disabled = false;
            btn.innerText = "🤖 Thử Lại (Khám Lại)";
        }
    }

    // Init UI
    renderUI();

</script>
</body>
</html>
