<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medstand — FE Renderer Test</title>
<link rel="stylesheet" href="theme.css">
<style>
/* ════════ RESET & VARS ════════ */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:var(--md-bg-base); --card:var(--md-bg-card); --card2:var(--md-bg-card-hover); --border:var(--md-border);
  --text:var(--md-text-main); --muted:var(--md-text-muted); --primary:var(--md-accent);
  --success:var(--md-success); --danger:var(--md-danger); --warning:var(--md-warning);
  --purple:var(--md-intent-color); --font:inherit;
}
html,body{overflow:hidden;width:100%;height:100%}
body{display:flex;height:100vh;font-size:14px}

/* ════════ SIDEBAR ════════ */
#sidebar{width:260px;min-width:220px;max-width:260px;flex-shrink:0;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
#sb-header{padding:14px 12px 8px;border-bottom:1px solid var(--border)}
#sb-header h2{font-size:14px;font-weight:700;background:linear-gradient(90deg,#3b82f6,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:3px}
#sb-header p{font-size:11px;color:var(--muted)}
#test-list{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 5px;display:flex;flex-direction:column;gap:2px}
.grp-lbl{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:8px 8px 3px}
.tbtn{background:transparent;border:1px solid transparent;border-radius:7px;padding:7px 8px;text-align:left;cursor:pointer;color:var(--text);font-size:12px;display:flex;align-items:flex-start;gap:6px;width:100%;min-width:0;overflow:hidden;transition:all .15s}
.tbtn:hover{background:var(--card2);border-color:var(--border)}
.tbtn.active{background:#1d3461;border-color:var(--primary);color:#93c5fd}
.dot{width:7px;height:7px;border-radius:50%;background:var(--border);flex-shrink:0;margin-top:4px;transition:background .2s}
.tbtn.pass .dot{background:var(--success)}
.tbtn.fail .dot{background:var(--danger)}
.tbtn.warn .dot{background:var(--warning)}
.tlbl{flex:1;min-width:0;line-height:1.3;overflow:hidden}
.tlbl>div:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.tsub{font-size:10px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}

/* ════════ MAIN ════════ */
#main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
#toolbar{padding:8px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;background:var(--card2);overflow:hidden}
#t-info{flex:1;min-width:0;overflow:hidden}
#t-title{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#t-meta{font-size:11px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{padding:6px 14px;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:#2563eb}
.btn-success{background:#15803d;color:#fff}.btn-success:hover{background:#166534}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}.btn-ghost:hover{background:var(--card)}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ════════ SPLIT ════════ */
#split{flex:1;display:flex;overflow:hidden}
#pane-mock{width:44%;min-width:280px;display:flex;flex-direction:column;border-right:1px solid var(--border);overflow:hidden}
.pane-hdr{padding:8px 12px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px}
.pane-hdr .badge{padding:1px 7px;border-radius:10px;font-size:10px;font-weight:700}
.bb{background:#1e3a6e;color:#93c5fd}.bg{background:#14532d;color:#86efac}.br{background:#450a0a;color:#fca5a5}
#mock-editor{flex:1;background:#0d1b2a;color:#a5f3fc;font-family:Consolas,'Courier New',monospace;font-size:12px;border:none;resize:none;padding:12px;outline:none;line-height:1.6;overflow:auto}
#pane-preview{flex:1;display:flex;flex-direction:column;overflow:hidden}
#preview-area{flex:1;overflow-y:auto;padding:16px;background:#f0f4f8}
#val-panel{border-top:1px solid var(--border);background:var(--card2);padding:8px 14px;font-size:12px;min-height:40px;max-height:160px;overflow-y:auto}
.vrow{display:flex;align-items:center;gap:7px;padding:3px 0;border-bottom:1px solid #1e293b}
.vrow:last-child{border-bottom:none}
.vic{font-size:13px;flex-shrink:0}.vmsg{flex:1;color:var(--muted)}
.vmsg.ok{color:#86efac}.vmsg.er{color:#fca5a5}.vmsg.wn{color:#fde68a}

/* ════════ GLOBAL BAR ════════ */
#gbar{padding:7px 14px;border-top:1px solid var(--border);background:#0a1628;display:flex;align-items:center;gap:14px;font-size:12px}
.gstat{display:flex;align-items:center;gap:5px}.gnum{font-weight:700;font-size:13px}
#json-st{font-size:10px;padding:1px 7px;border-radius:10px;font-weight:700}
#json-st.ok{background:#14532d;color:#86efac}#json-st.er{background:#450a0a;color:#fca5a5}

/* ════════ PREVIEW AREA — Chatbot card styles (self-contained) ════════ */
#preview-area{color:#1e293b}
.ai-result-header{font-weight:600;font-size:13px;color:#475569;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid #e2e8f0}
/* Card */
.ai-card-list{display:flex;flex-direction:column;gap:16px}
.ai-card{background:#fff;border:1px solid rgba(0,0,0,0.05);border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.ai-card-header{display:flex;align-items:flex-start;justify-content:space-between;padding:12px 14px 8px;border-bottom:1px solid #f1f5f9;background:linear-gradient(135deg,#f8fafc,#f1f5f9);gap:8px}
.ai-card-title{font-weight:700;letter-spacing:0.5px;font-size:13px;color:#111827;flex:1;min-width:0;word-break:break-word}
.ai-card-meta{display:flex;align-items:center;gap:6px;margin-top:4px;flex-wrap:wrap}
.ai-card-id{font-size:11px;color:#374151;font-weight:700;letter-spacing:0.5px;font-family:monospace}
.ai-badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700}
.ai-badge-green{background:#dcfce7;color:#166534}
.ai-badge-blue{background:#dbeafe;color:#1d4ed8}
.ai-badge-red{background:#fee2e2;color:#991b1b}
.ai-badge-gray{background:#f1f5f9;color:#475569}
.ai-card-body{padding:10px 14px;display:flex;flex-direction:column;gap:4px}
.ai-card-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:2px 0;border-bottom:1px solid #f8fafc}
.ai-card-row:last-child{border-bottom:none}
.ai-card-label{color:#374151;font-weight:500}
.ai-card-value{color:#1e293b;font-weight:500;text-align:right;max-width:60%}
.ai-card-money{font-size:13px;font-weight:700;color:#0f766e;padding:6px 10px;background:#f0fdfa;border-radius:8px;border-left:3px solid #0f766e}
.ai-card-trend{font-size:12px;padding:2px 0}
.ai-trend-up{color:#16a34a}.ai-trend-down{color:#dc2626}
/* Action bar */
.ai-sales-action-bar{display:flex;gap:6px;padding:8px 14px;border-top:1px solid #f1f5f9;flex-wrap:wrap}
.ai-sales-action-btn{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border-radius:8px;font-size:12px;font-weight:600;text-decoration:none;cursor:pointer;border:none;transition:all .15s}
.ai-sales-btn-call{background:#dcfce7;color:#166534}.ai-sales-btn-call:hover{background:#bbf7d0}
.ai-sales-btn-zalo{background:#dbeafe;color:#1d4ed8}.ai-sales-btn-zalo:hover{background:#bfdbfe}
.ai-sales-btn-order{background:#fef3c7;color:#92400e}
.ai-sales-btn-disabled{background:#f1f5f9;color:#94a3b8}
/* Toggle table */
.ai-inline-container{margin-top:6px}
.ai-table-btn{display:inline-flex;align-items:center;justify-content:center;width:100%;gap:5px;margin:10px 0 0;padding:9px 18px;background:linear-gradient(135deg,#e0f2fe,#cffafe);color:#0369a1;border:1px solid rgba(14,165,233,0.3);border-radius:24px;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s}
.ai-table-btn:hover{background:linear-gradient(135deg,#bae6fd,#bae6fd);transform:translateY(-1px)}
.ai-view-table{overflow-x:auto;border-radius:8px;border:1px solid #e2e8f0}
.ai-inline-table{width:100%;border-collapse:collapse;font-size:12px}
.ai-inline-table th{background:#f8fafc;padding:7px 10px;text-align:left;font-weight:700;color:#475569;border-bottom:1px solid #e2e8f0;white-space:nowrap;font-size:11px;text-transform:uppercase;letter-spacing:.03em}
.ai-inline-table td{padding:7px 10px;border-bottom:1px solid #f1f5f9;color:#1e293b;white-space:nowrap}
.ai-inline-table tbody tr:last-child td{border-bottom:none}
.ai-inline-table tbody tr:hover{background:#f8fafc}
/* Tabs */
.ai-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;border-bottom:2px solid #e2e8f0;padding-bottom:6px}
.ai-tab-btn{padding:5px 14px;border:none;border-radius:14px;font-weight:600;font-size:12px;cursor:pointer;outline:none;transition:background .15s}
/* Catalog grid */
.ai-catalog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.ai-catalog-card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
/* CONG_NO custom card */
.ai-sales-debt-card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.ai-sales-debt-header{background:linear-gradient(135deg,#f0f4ff,#e8f4fd);padding:14px 16px;border-bottom:1px solid #e2e8f0}
.ai-sales-debt-title{font-weight:700;font-size:15px;color:#1e293b;margin-bottom:4px}
.ai-sales-debt-inforow{font-size:12px;color:#475569;margin-bottom:2px}
.ai-sales-debt-conclusion{margin-top:8px;font-size:13px;font-weight:600;color:#0f766e}
.ai-sales-positive{color:#16a34a}.ai-sales-negative{color:#dc2626}
.ai-sales-toggle-btn{display:block;width:100%;text-align:center;padding:8px;font-size:12px;background:#f8fafc;border:none;border-bottom:1px solid #e2e8f0;cursor:pointer;color:#3b82f6;font-weight:600}
.ai-sales-debt-list{padding:10px 14px;display:flex;flex-direction:column;gap:8px}
.ai-sales-debt-item{background:#f8fafc;border-radius:7px;padding:8px 10px;border-left:3px solid #e2e8f0}
.ai-sales-debt-item-top{display:flex;justify-content:space-between;font-size:11px;color:#64748b;margin-bottom:2px}
.ai-sales-debt-item-middle{font-size:12px;color:#475569;margin-bottom:3px}
.ai-sales-debt-item-bottom{font-size:13px;font-weight:700}
.ai-sales-debt-footer{padding:10px 14px;background:#f8fafc;border-top:1px solid #e2e8f0;font-size:12px;color:#475569;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ai-sales-debt-summary{flex:1}
.ai-sales-debt-ai-recommend{padding:10px 14px;background:#fffbeb;border-top:1px solid #fef3c7}
.ai-recommend-title{font-weight:700;font-size:12px;color:#92400e;margin-bottom:3px}
.ai-recommend-text{font-size:12px;color:#78350f}
/* TICH_LUY */
.ai-sales-milestone-card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.ai-sales-milestone-header{background:linear-gradient(135deg,#fdf4ff,#f0f4ff);padding:14px 16px;border-bottom:1px solid #e2e8f0}
.ai-sales-milestone-title{font-weight:700;font-size:15px;color:#1e293b}
.ai-sales-milestone-subtitle{font-size:12px;color:#64748b;margin-top:2px}
.ai-sales-progress-container{padding:14px 16px}
.ai-sales-progress-labels{display:flex;justify-content:space-between;font-size:12px;color:#475569;margin-bottom:7px}
.ai-sales-progress-current{font-weight:700;color:#1e293b}
.ai-sales-progress-bar-bg{height:14px;background:#e2e8f0;border-radius:99px;overflow:hidden}
.ai-sales-progress-bar-fill{height:100%;border-radius:99px;transition:width .5s}
.ai-sales-progress-bar-fill.success{background:linear-gradient(90deg,#22c55e,#16a34a)}
.ai-sales-progress-bar-fill.warning{background:linear-gradient(90deg,#f59e0b,#d97706)}
.ai-sales-progress-bar-fill.danger{background:linear-gradient(90deg,#ef4444,#dc2626)}
.ai-sales-progress-pct{text-align:center;font-size:12px;color:#64748b;margin-top:5px;font-weight:600}
.ai-sales-milestone-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 14px}
.ai-sales-stat-box{background:#f8fafc;border-radius:8px;padding:10px;text-align:center;border:1px solid #e2e8f0}
.ai-stat-val{font-size:16px;font-weight:700;color:#1e293b}
.ai-stat-label{font-size:11px;color:#64748b;margin-top:2px}
.ai-sales-milestone-reminder{padding:10px 14px;background:#fffbeb;border-top:1px solid #fef3c7}
.ai-reminder-title{font-weight:700;font-size:12px;color:#92400e;margin-bottom:3px}
.ai-reminder-text{font-size:12px;color:#78350f}
/* Empty state */
.ai-empty{text-align:center;padding:30px;color:#64748b;font-size:13px}
/* Error/text */
.ai-text-msg{font-size:13px;color:#475569;line-height:1.6;padding:8px 4px}
.ai-error-msg{font-size:13px;color:#dc2626;font-weight:600;padding:8px 4px}
/* Pagination details */
details summary{cursor:pointer;padding:8px;text-align:center;color:#3b82f6;font-weight:700;font-size:12px;background:#eff6ff;border-radius:7px;margin-bottom:8px;list-style:none}
details summary::-webkit-details-marker{display:none}
</style>
</head>
<body class="medstand-theme">

<!-- ══ SIDEBAR ══ -->
<div id="sidebar">
  <div id="sb-header">
    <h2>🧪 FE Renderer Test</h2>
    <p>Mock JSON → kiểm tra UI render FE</p>
  </div>
  <div id="test-list"></div>
</div>

<!-- ══ MAIN ══ -->
<div id="main">
  <div id="toolbar">
    <div id="t-info">
      <div id="t-title">Chọn test case ←</div>
      <div id="t-meta">—</div>
    </div>
    <button class="btn btn-primary" onclick="runTest()">▶ Render</button>
    <button class="btn btn-success" id="btnAll" onclick="runAll()">⚡ Run All</button>
    <button class="btn btn-ghost" onclick="prettyJson()">Beautify</button>
    <button class="btn btn-ghost" onclick="copyJson()">📋 Copy</button>
  </div>
  <div id="split">
    <!-- LEFT: JSON editor -->
    <div id="pane-mock">
      <div class="pane-hdr">
        Mock API Response <span class="badge bb">JSON</span>
        <span id="json-st" class="ok">✓ Valid</span>
        <div style="flex:1"></div>
      </div>
      <textarea id="mock-editor" spellcheck="false" oninput="checkJson()">{}</textarea>
    </div>
    <!-- RIGHT: Preview -->
    <div id="pane-preview">
      <div class="pane-hdr">Live Preview (Render thật) <span class="badge bg">UI</span></div>
      <div id="preview-area">
        <div style="text-align:center;margin-top:60px;color:#94a3b8;font-size:13px">← Chọn test rồi nhấn <b>▶ Render</b></div>
      </div>
      <div id="val-panel">
        <div class="vrow"><span class="vic">💡</span><span class="vmsg">Validators hiển thị sau khi render.</span></div>
      </div>
    </div>
  </div>
  <div id="gbar">
    <span style="color:var(--muted);font-weight:700">TỔNG:</span>
    <span class="gstat"><span style="color:var(--success)">✔</span>&nbsp;<span class="gnum" id="gP" style="color:var(--success)">0</span> PASS</span>
    <span class="gstat"><span style="color:var(--danger)">✘</span>&nbsp;<span class="gnum" id="gF" style="color:var(--danger)">0</span> FAIL</span>
    <span class="gstat"><span style="color:var(--warning)">⚠</span>&nbsp;<span class="gnum" id="gW" style="color:var(--warning)">0</span> WARN</span>
    <span style="flex:1"></span>
    <span style="color:var(--muted)">Medstand FE Renderer Test v2.0</span>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════════════
//  SELF-CONTAINED RENDER ENGINE
//  Bắt chước đúng logic từ chatbot.js mà không cần load nó
// ════════════════════════════════════════════════════════════

// Escape HTML
function esc(s){
  var d=document.createElement('div');
  d.appendChild(document.createTextNode(String(s??'')));
  return d.innerHTML;
}

// Format số tiền, ngày
function fmt(v){
  if(v===null||v===undefined) return '';
  var s=String(v);
  if(/^\d{4}-\d{2}-\d{2}T/.test(s)) return s.split('T')[0];
  if(!isNaN(v)&&Math.abs(Number(v))>=1000&&!s.includes('.')) return Number(v).toLocaleString('vi-VN');
  return s;
}

// badge class
function badgeCls(v){
  var u=String(v).trim().toUpperCase();
  if(u==='A'||u==='VIP'||u==='ACTIVE') return 'ai-badge-green';
  if(u==='B'||u==='NORMAL') return 'ai-badge-blue';
  if(u==='C'||u.includes('RỦI')||u.includes('RISK')||u.includes('NGUY')) return 'ai-badge-red';
  return 'ai-badge-gray';
}

// pickField — bắt chước heuristic trong chatbot.js
function pickField(row, role){
  if(!row) return null;
  var keys=Object.keys(row);
  var lk=keys.map(k=>k.toLowerCase());
  function find(targets){
    for(var t of targets){
      var i=lk.indexOf(t);
      if(i!==-1&&row[keys[i]]!==null&&row[keys[i]]!==undefined&&String(row[keys[i]]).trim()!=='')
        return {key:keys[i],val:row[keys[i]]};
    }
    return null;
  }
  if(role==='TITLE') return find(['itemname','objectname','tendoitac','tenkhachhang','tencuahang','employeename','name','fullname','hoten','ten','title','tieu_de','diengiai','noidung','ghichu']);
  if(role==='ID')    return find(['itemid','objectid','employeeid','makhachhang','code','ma','id','docno','documentid','mahd','sohd','macode']);
  if(role==='BADGE') return find(['phanloai','nhom','trangthai','status','loai','badge','nhomhang']);
  if(role==='MONEY') return find(['doanhso','tongtien','tongno','doanhthu','dongia','sotien','tien','tongthu','soluong']);
  if(role==='TREND') return find(['ngay','date','ngayhd','thoigian','ngaybaocao','ngayct']);
  if(role==='COUNT') return find(['tongsohoadon','sohd','soluong','count','soluongton']);
  if(role==='PERCENT') return find(['hoanthanh','tyle','percent','percentage']);
  if(role==='TARGET') return find(['muctieu','target']);
  if(role==='PHONE') return find(['sodienthoai','dienthoai','phone','sdt']);
  return null;
}
function pickVal(row,role){ var f=pickField(row,role); return f?f.val:null; }

// Get all visible keys from rows
function getKeys(rows){
  var keys=[]; var hidden=['_debug_llm'];
  rows.forEach(r=>Object.keys(r).forEach(k=>{if(!keys.includes(k)&&!hidden.includes(k)&&!k.startsWith('Metadata_'))keys.push(k);}));
  return keys;
}

// Build inline HTML table
var _idCtr=0;
function buildTable(rows,keys){
  var html='<table class="ai-inline-table"><thead><tr>';
  keys.forEach(k=>{ html+=`<th>${esc(k)}</th>`; });
  html+='</tr></thead><tbody>';
  rows.forEach(r=>{
    html+='<tr>';
    keys.forEach(k=>{ html+=`<td>${esc(fmt(r[k]??''))}</td>`; });
    html+='</tr>';
  });
  html+='</tbody></table>';
  return html;
}

// Build action bar
function buildActionBar(row, apiCode){
  var phone=pickVal(row,'PHONE');
  var title=pickVal(row,'TITLE');
  if(!phone&&!title) return '';
  
  var isFinanceContext = false;
  if(apiCode && (apiCode.indexOf('@doanh_so')!==-1 || apiCode.indexOf('@cong_no')!==-1 || apiCode.indexOf('FIN-')!==-1 || apiCode.indexOf('HR-')!==-1)) {
     isFinanceContext = true;
  }

  var html='<div class="ai-sales-action-bar">';
  if(phone&&/^\+?[\d\s\-\.]{8,15}$/.test(phone)){
    html+=`<a class="ai-sales-action-btn ai-sales-btn-call" href="tel:${esc(phone)}">📞 Gọi</a>`;
    html+=`<a class="ai-sales-action-btn ai-sales-btn-zalo" href="https://zalo.me/${esc(phone)}" target="_blank" rel="noopener">💬 Zalo</a>`;
  }
  if(title && !isFinanceContext){
    html+=`<button class="ai-sales-action-btn ai-sales-btn-order" onclick="alert('Lên đơn cho: ${esc(title)}')">🛒 Lên đơn</button>`;
  }
  html+='</div>';
  return html;
}

// Render single card
function renderCard(row,keys,idx,apiCode){
  var titleF=pickField(row,'TITLE');
  var idF=pickField(row,'ID');
  var badgeF=pickField(row,'BADGE');
  var moneyF=pickField(row,'MONEY');
  var trendF=pickField(row,'TREND');
  var usedKeys=[];
  if(titleF) usedKeys.push(titleF.key);
  if(idF) usedKeys.push(idF.key);
  if(badgeF) usedKeys.push(badgeF.key);
  if(moneyF) usedKeys.push(moneyF.key);
  if(trendF) usedKeys.push(trendF.key);

  var html='<div class="ai-card">';
  html+='<div class="ai-card-header">';
  html+=`<div class="ai-card-title">${esc(String(titleF?.val ?? ('Mục '+(idx+1))))}</div>`;
  html+='<div class="ai-card-meta">';
  if(idF) html+=`<span class="ai-card-id">${esc(String(idF.val))}</span>`;
  if(badgeF) html+=`<span class="ai-badge ${badgeCls(badgeF.val)}">${esc(String(badgeF.val))}</span>`;
  html+='</div></div>';
  html+='<div class="ai-card-body">';
  if(moneyF){ html+=`<div class="ai-card-money">💰 ${esc(moneyF.key)}: <strong>${fmt(moneyF.val)}</strong></div>`; }
  if(trendF){
    var tv=String(trendF.val);
    var tcls=(tv.includes('-')||tv.includes('giảm'))?'ai-trend-down':'ai-trend-up';
    html+=`<div class="ai-card-trend ${tcls}">📈 ${esc(trendF.key)}: ${esc(tv)}</div>`;
  }
  keys.forEach(k=>{
    if(usedKeys.includes(k)) return;
    var v=row[k];
    if(v===null||v===undefined||String(v).trim()==='') return;
    html+=`<div class="ai-card-row"><span class="ai-card-label">${esc(k)}</span><span class="ai-card-value">${esc(fmt(v))}</span></div>`;
  });
  html+='</div>';
  html+=buildActionBar(row);
  html+='</div>';
  return html;
}

// Render single group (card list + toggle table)
function renderGroup(rows,apiCode){
  var keys=getKeys(rows);
  var vId='view-'+(++_idCtr);
  var MAX=30;
  var html=`<div class="ai-inline-container" id="${vId}">`;
  html+='<div class="ai-view-cards"><div class="ai-card-list">';
  rows.slice(0,MAX).forEach((r,i)=>{ html+=renderCard(r,keys,i); });
  html+='</div>';
  if(rows.length>MAX){
    html+=`<details><summary>⏬ Xem thêm ${rows.length-MAX} thẻ nữa (Tổng ${rows.length})</summary><div class="ai-card-list">`;
    rows.slice(MAX).forEach((r,i)=>{ html+=renderCard(r,keys,MAX+i); });
    html+='</div></details>';
  }
  html+='</div>';
  html+=`<button class="ai-table-btn ai-inline-toggle-btn" data-view-id="${vId}" data-orig="📊 Xem dạng bảng">📊 Xem dạng bảng</button>`;
  html+=`<div class="ai-view-table" style="display:none">${buildTable(rows,keys)}</div>`;
  html+='</div>';
  return html;
}

// ── Renderer: DEFAULT Card View (with grouping/tabs) ──
function renderDefault(rows, data){
  var badgeKey=null, distinctBadges=0;
  var sampleBF=pickField(rows[0],'BADGE');
  if(sampleBF){
    badgeKey=sampleBF.key;
    var bv={};
    rows.forEach(r=>{ bv[String(r[badgeKey]||'').trim()]=1; });
    distinctBadges=Object.keys(bv).length;
  }
  var useBadge=badgeKey&&distinctBadges>=2&&distinctBadges<=15;

  var groupsMap={};
  rows.forEach(r=>{
    var sig=useBadge?('G|'+String(r[badgeKey]||'').trim()):'DEFAULT';
    if(!groupsMap[sig]) groupsMap[sig]={rows:[],label:useBadge?String(r[badgeKey]||'Khác'):'Tất cả'};
    groupsMap[sig].rows.push(r);
  });
  var groups=Object.values(groupsMap);

  var html='';
  if(data.message) html+=`<div class="ai-result-header">${esc(data.message)}</div>`;

  if(groups.length>1){
    var tabId='t'+(++_idCtr);
    html+=`<div class="ai-tabs" id="tabs-${tabId}">`;
    groups.forEach((g,i)=>{
      var active=i===0;
      html+=`<button class="ai-tab-btn" style="background:${active?'#1d4ed8':'#e2e8f0'};color:${active?'#fff':'#475569'}" onclick="switchTab('${tabId}',${i},this)">${esc(g.label)}&nbsp;(${g.rows.length})</button>`;
    });
    html+='</div><div>';
    groups.forEach((g,i)=>{
      html+=`<div class="ai-tab-pane-${tabId}" style="display:${i===0?'block':'none'}" id="${tabId}-p${i}">`;
      html+=renderGroup(g.rows,data.apiCode);
      html+='</div>';
    });
    html+='</div>';
  } else {
    html+=renderGroup(rows,data.apiCode);
  }
  return html;
}

// ── Tab switch helper ──
function switchTab(tabId, idx, btn){
  document.querySelectorAll('.ai-tab-pane-'+tabId).forEach(p=>p.style.display='none');
  document.getElementById(tabId+'-p'+idx).style.display='block';
  btn.closest('.ai-tabs').querySelectorAll('.ai-tab-btn').forEach(b=>{b.style.background='#e2e8f0';b.style.color='#475569';});
  btn.style.background='#1d4ed8'; btn.style.color='#fff';
}

// ── Toggle table button wiring ──
function wireToggleBtns(container){
  container.querySelectorAll('.ai-inline-toggle-btn').forEach(btn=>{
    btn.addEventListener('click',function(){
      var vId=btn.getAttribute('data-view-id');
      var orig=btn.getAttribute('data-orig');
      var c=document.getElementById(vId);
      if(!c) return;
      var cards=c.querySelector('.ai-view-cards');
      var table=c.querySelector('.ai-view-table');
      if(!cards||!table) return;
      if(table.style.display==='none'){
        table.style.display='block'; cards.style.display='none'; btn.textContent='🃏 Xem dạng thẻ';
      } else {
        table.style.display='none'; cards.style.display='block'; btn.textContent=orig||'📊 Xem dạng bảng';
      }
    });
  });
}

// ════════════════════════════════════════════════════════════
//  MAIN: simulateRender — replicate _handleReply từ chatbot.js
// ════════════════════════════════════════════════════════════
function simulateRender(data){
  var area=document.getElementById('preview-area');
  area.innerHTML='';
  var wrap=document.createElement('div');
  wrap.style.cssText='max-width:600px;margin:0 auto';
  area.appendChild(wrap);

  try {
    // Case 1: OPEN_API_PANEL
    if(data&&data.action_code==='OPEN_API_PANEL'){
      wrap.innerHTML=`<div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:16px">
        <div style="color:#1d4ed8;font-weight:700;font-size:14px;margin-bottom:6px">📋 OPEN_API_PANEL: ${esc(data.api_name||'Unknown')}</div>
        ${data.message?`<p style="color:#475569;font-size:13px">${esc(data.message)}</p>`:''}
        <p style="color:#94a3b8;font-size:12px;margin-top:6px">→ Form panel sẽ trượt lên trong app thật.</p>
      </div>`;
      return wrap;
    }

    // Case 2: status=success + data[]
    if(data&&data.status==='success'&&Array.isArray(data.data)){
      if(data.data.length===0){
        wrap.innerHTML='<div class="ai-empty">📭 Không tìm thấy dữ liệu.</div>';
        return wrap;
      }
      // Filter null-only rows
      var clean=data.data.filter(r=>{
        var vk=Object.keys(r).filter(k=>!['_debug_llm'].includes(k)&&!k.startsWith('Metadata_'));
        return vk.some(k=>r[k]!==null&&r[k]!==undefined&&String(r[k]).trim()!=='');
      });
      if(clean.length===0){
        wrap.innerHTML='<div class="ai-empty">📭 Không tìm thấy dữ liệu.</div>';
        return wrap;
      }

      var tpl=((data.uiTemplate)||'DEFAULT').toUpperCase();
      var html='';
      if(tpl==='CONG_NO')   html=renderCongNo(clean,data);
      else if(tpl==='TICH_LUY') html=renderTichLuy(clean,data);
      else                   html=renderDefault(clean,data);

      wrap.innerHTML=html;
      wireToggleBtns(wrap);
      return wrap;
    }

    // Case 3: status=error
    if(data&&data.status==='error'){
      wrap.innerHTML=`<div class="ai-error-msg">❌ ${esc(data.message||'Có lỗi xảy ra.')}</div>`;
      return wrap;
    }

    // Case 4: fallback text
    var reply='';
    if(typeof data==='string') reply=data;
    else if(data?.response) reply=data.response;
    else if(data?.reply) reply=typeof data.reply==='object'?JSON.stringify(data.reply):data.reply;
    else if(data?.message) reply=data.message;
    else if(data?.output)  reply=data.output;
    else reply=JSON.stringify(data);

    wrap.innerHTML=`<div class="ai-text-msg">${esc(String(reply))}</div>`;
    return wrap;

  } catch(ex){
    wrap.innerHTML=`<div class="ai-error-msg">💥 RENDER CRASH: ${esc(ex.message)}</div>`;
    console.error(ex);
    return wrap;
  }
}

// ════════════════════════════════════════════════════════════
//  UI CONTROLLER
// ════════════════════════════════════════════════════════════
var _cur=null, _results={};

function buildSidebar(){
  var list=document.getElementById('test-list');
  list.innerHTML='';
  var curG='';
  TESTS.forEach((tc,i)=>{
    if(tc.group!==curG){
      curG=tc.group;
      var lbl=document.createElement('div');
      lbl.className='grp-lbl'; lbl.textContent=tc.group;
      list.appendChild(lbl);
    }
    var btn=document.createElement('button');
    btn.className='tbtn'; btn.id='sb-'+tc.id;
    btn.onclick=()=>selectTest(i);
    btn.innerHTML=`<span class="dot"></span><div class="tlbl"><div>${tc.id}: ${tc.name}</div><div class="tsub">${tc.desc}</div></div>`;
    list.appendChild(btn);
  });
}

function selectTest(idx){
  _cur=TESTS[idx];
  document.querySelectorAll('.tbtn').forEach(b=>b.classList.remove('active'));
  document.getElementById('sb-'+_cur.id).classList.add('active');
  document.getElementById('t-title').textContent=`${_cur.id}: ${_cur.name}`;
  document.getElementById('t-meta').textContent=_cur.desc;
  document.getElementById('mock-editor').value=JSON.stringify(_cur.mock,null,2);
  checkJson();
  document.getElementById('preview-area').innerHTML='<div style="text-align:center;margin-top:60px;color:#94a3b8;font-size:13px">Nhấn <b>▶ Render</b></div>';
  document.getElementById('val-panel').innerHTML='<div class="vrow"><span class="vic">💡</span><span class="vmsg">Nhấn Render để kiểm tra.</span></div>';
}

function checkJson(){
  var st=document.getElementById('json-st');
  try{ JSON.parse(document.getElementById('mock-editor').value); st.textContent='✓ Valid'; st.className='ok'; }
  catch(e){ st.textContent='✗ Lỗi JSON'; st.className='er'; }
}
function prettyJson(){
  try{
    var v=document.getElementById('mock-editor').value;
    document.getElementById('mock-editor').value=JSON.stringify(JSON.parse(v),null,2);
  }catch(e){}
}
function copyJson(){
  navigator.clipboard.writeText(document.getElementById('mock-editor').value)
    .then(()=>alert('✓ Đã copy JSON!')).catch(()=>{});
}

function runValidators(tc,el){
  var panel=document.getElementById('val-panel');
  panel.innerHTML='';
  var pass=0,fail=0,warn=0;
  tc.validators.forEach(v=>{
    var ok=false;
    try{ ok=v.check(el); } catch(e){ ok=false; }
    var row=document.createElement('div'); row.className='vrow';
    var icon,cls;
    if(ok){ icon='✅'; cls='ok'; pass++; }
    else if(v.lvl==='warn'){ icon='⚠️'; cls='wn'; warn++; }
    else { icon='❌'; cls='er'; fail++; }
    row.innerHTML=`<span class="vic">${icon}</span><span class="vmsg ${cls}">${esc(v.msg)}</span>`;
    panel.appendChild(row);
  });
  var btn=document.getElementById('sb-'+tc.id);
  if(btn){ btn.classList.remove('pass','fail','warn');
    btn.classList.add(fail>0?'fail':warn>0?'warn':'pass'); }
  _results[tc.id]={pass,fail,warn};
  return {pass,fail,warn};
}

function updateBar(){
  var p=0,f=0,w=0;
  Object.values(_results).forEach(r=>{p+=r.pass;f+=r.fail;w+=r.warn;});
  document.getElementById('gP').textContent=p;
  document.getElementById('gF').textContent=f;
  document.getElementById('gW').textContent=w;
}

function runTest(){
  if(!_cur){ alert('Chọn test case từ sidebar trước!'); return; }
  var txt=document.getElementById('mock-editor').value;
  var data;
  try{ data=JSON.parse(txt); }
  catch(e){ alert('JSON không hợp lệ:\n'+e.message); return; }
  var el=simulateRender(data);
  runValidators(_cur,el);
  updateBar();
}

async function runAll(){
  var btn=document.getElementById('btnAll');
  btn.disabled=true; btn.textContent='⏳ Running...';
  _results={};
  for(var i=0;i<TESTS.length;i++){
    selectTest(i);
    await new Promise(r=>setTimeout(r,50));
    runTest();
    updateBar();
    await new Promise(r=>setTimeout(r,50));
  }
  btn.disabled=false; btn.textContent='⚡ Run All';
  var p=0,f=0,w=0;
  Object.values(_results).forEach(r=>{p+=r.pass;f+=r.fail;w+=r.warn;});
  alert(`✅ HOÀN TẤT!\nPASS: ${p}  |  FAIL: ${f}  |  WARN: ${w}`);
}

window.onload=buildSidebar;
</script>
